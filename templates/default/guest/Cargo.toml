[package]
name = "e3-openvm-guest"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"

# Proves this project's E3 program. Built for the OpenVM target with `cargo openvm build`
# (see `interfold program compile`), so it is a workspace of its own.
[workspace]
resolver = "3"

[dependencies]
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2", features = ["std", "heap-embedded-alloc"] }
openvm-algebra-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
openvm-sha2 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
e3-user-program = { path = "../program", features = ["openvm-hashes"] }
e3-compute-provider = { path = "../../../crates/program/compute-provider" }
e3-openvm-types = { path = "../../../crates/program/openvm-types" }
e3-safe = { path = "../../../crates/safe", features = ["openvm"] }
# fhe.rs pins a separate SAFE source; its guest feature must be enabled on that exact package too.
fhe-safe = { package = "e3-safe", git = "https://github.com/theinterfold/interfold", rev = "ab6b9c943b6d23eda8d0ba5f2efd9039635acfa4", features = ["openvm"] }
sha2 = "=0.10.9"

[profile.release]
lto = "fat"
codegen-units = 1
