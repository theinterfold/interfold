[workspace]
resolver = "3"
members = [
  "program",
  "runner"
]

[workspace.dependencies]
e3-user-program = { path = "./program" }
fhe = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.6.0", default-features = false, features = ["experimental-mbfv"] }
fhe-traits = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.6.0" }
e3-program-runner = { path = "../../crates/program/runner" }
e3-bfv-client = { path = "../../crates/bfv/client" }
e3-fhe-params = { path = "../../crates/bfv/params" }
e3-compute-provider = { path = "../../crates/program/compute-provider" }
rand = "0.9"
anyhow = "1.0.86"
