# DAppNode Setup Wizard - Interfold Ciphernode
version: '2'
fields:
  - id: CREDENTIALS_FILE
    target:
      type: fileUpload
      path: /data/secrets.json
      service: ciphernode
    title: Node credentials (skip on updates)
    description: |
      **Updates: no reupload needed. Leave this field empty.**
      The node reuses your saved identity automatically.

      **First installation:** upload `secrets.json` with your operator private key and an encryption password:

      ```json
      {
        "password": "a strong encryption password",
        "private_key": "0x<64 hex characters>"
      }
      ```

      Keep an encrypted backup offline. The node saves its encrypted identity and deletes the uploaded file.
    required: false
