# Interfold Ciphernode Configuration
# Generated by DAppNode entrypoint

node:
  network: '${NETWORK}'
  address: '${NODE_ADDRESS}'
  quic_port: ${QUIC_PORT}
  # Credentials are provisioned from /run/secrets/secrets.json before start.
  # Fail closed if required credential state is absent instead of generating a
  # different identity during a restart or maintenance CLI invocation.
  autonetkey: false
  autopassword: false
  autowallet: false

chains:
  - name: '${NETWORK}'
    rpc_url: '${RPC_URL}'
    chain_id: ${CHAIN_ID}
    data_availability:
      mode: avail
      rpc_url: '${AVAIL_RPC_URL}'
    contracts:
      interfold:
        address: '${INTERFOLD_CONTRACT}'
        deploy_block: ${INTERFOLD_DEPLOY_BLOCK}
      ciphernode_registry:
        address: '${CIPHERNODE_REGISTRY_CONTRACT}'
        deploy_block: ${CIPHERNODE_REGISTRY_DEPLOY_BLOCK}
      bonding_registry:
        address: '${BONDING_REGISTRY_CONTRACT}'
        deploy_block: ${BONDING_REGISTRY_DEPLOY_BLOCK}
      slashing_manager:
        address: '${SLASHING_MANAGER_CONTRACT}'
        deploy_block: ${SLASHING_MANAGER_DEPLOY_BLOCK}
      fee_token:
        address: '${FEE_TOKEN_CONTRACT}'
        deploy_block: ${FEE_TOKEN_DEPLOY_BLOCK}
