# The upstream dashboard stays on loopback. Listen only on the Dappnode VPN IP.
worker_processes 1;
pid /tmp/interfold-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/interfold-client;
    proxy_temp_path /tmp/interfold-proxy;
    fastcgi_temp_path /tmp/interfold-fastcgi;
    uwsgi_temp_path /tmp/interfold-uwsgi;
    scgi_temp_path /tmp/interfold-scgi;
    server {
        listen ${DASHBOARD_BIND_ADDRESS}:8081;
        server_tokens off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_intercept_errors on;
            error_page 502 503 504 /starting.html;
        }
        location = /starting.html {
            internal;
            root /opt;
        }
    }
}
