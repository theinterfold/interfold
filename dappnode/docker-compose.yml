version: '3.5'
services:
  ciphernode:
    build:
      context: .
      args:
        UPSTREAM_VERSION: 0.14.0
    image: 'ciphernode.interfold-ciphernode.public.dappnode.eth:0.5.0'
    restart: unless-stopped
    # Allow the node's 30-second durability barrier to finish before Docker sends SIGKILL.
    stop_grace_period: 45s
    volumes:
      - 'ciphernode_data:/data'
    ports:
      - 37173:37173/udp
    environment:
      # Required
      RPC_URL: ''
      AVAIL_RPC_URL: ''
      # Network & node config
      NETWORK: 'mainnet'
      CHAIN_ID: '1'
      NODE_ADDRESS: ''
      QUIC_PORT: '37173'
      PEERS: ''
      LOG_LEVEL: 'info'
      EXTRA_OPTS: ''
      # Contracts (variants override these)
      INTERFOLD_CONTRACT: '0x28cF63B459e6218C69EA97ea7D90541cf648c715'
      CIPHERNODE_REGISTRY_CONTRACT: '0xC927A5B2d8F68697bC28C0670df05178c93df2d7'
      BONDING_REGISTRY_CONTRACT: '0x0ec90465095C21830BEcED07e032809A2Bd2915F'
      SLASHING_MANAGER_CONTRACT: '0x974E865B1BB24AF2a9ef8204AdEA9251Cc7C5FD9'
      FEE_TOKEN_CONTRACT: '0xdC035D45d973E3EC169d2276DDab16f1e407384F'
      INTERFOLD_DEPLOY_BLOCK: '25786382'
      CIPHERNODE_REGISTRY_DEPLOY_BLOCK: '25786378'
      BONDING_REGISTRY_DEPLOY_BLOCK: '25473398'
      SLASHING_MANAGER_DEPLOY_BLOCK: '25786375'
      FEE_TOKEN_DEPLOY_BLOCK: '20663730'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  ciphernode_data: {}
