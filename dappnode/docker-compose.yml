version: '3.5'
services:
  ciphernode:
    build:
      # The build script runs the SDK here. Compose (relative to this file) and Buildx (relative to
      # the working directory) then both resolve the repository root.
      context: ..
      dockerfile: dappnode/Dockerfile
      args:
        UPSTREAM_VERSION: 0.19.0
        DAPPNODE_NETWORK: mainnet
    restart: unless-stopped
    # Allow the node's 60-second durability barrier to finish before Docker sends SIGKILL.
    stop_grace_period: 65s
    volumes:
      - 'ciphernode_data:/data'
    ports:
      - 37173:37173/udp
    environment:
      # Required
      RPC_URL: 'ws://execution.mainnet.dncore.dappnode:8546'
      AVAIL_RPC_URL: ''
      # Network & node config
      QUIC_PORT: '37173'
      PEERS: ''
      LOG_LEVEL: 'info'
      EXTRA_OPTS: ''
      DASHBOARD_ENABLED: 'true'
      # Adds --allow-active-e3s to a refused state reset. Set it only as the README describes.
      ALLOW_ACTIVE_E3S_RESET: 'false'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  ciphernode_data: {}
