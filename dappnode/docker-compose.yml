version: '3.5'
services:
  ciphernode:
    build:
      context: .
      args:
        UPSTREAM_VERSION: 0.2.3
    image: 'ciphernode.interfold-ciphernode.public.dappnode.eth:0.2.3'
    restart: unless-stopped
    # Allow the node's 30-second durability barrier to finish before Docker sends SIGKILL.
    stop_grace_period: 45s
    volumes:
      - 'ciphernode_data:/data'
    ports:
      - 37173:37173/udp
    environment:
      # Required
      RPC_URL: ''
      # Network & node config
      NETWORK: 'sepolia'
      CHAIN_ID: '11155111'
      REORG_CONFIRMATIONS: '64'
      NODE_ADDRESS: ''
      QUIC_PORT: '37173'
      PEERS: ''
      LOG_LEVEL: 'info'
      EXTRA_OPTS: ''
      # Contracts (variants override these)
      INTERFOLD_CONTRACT: ''
      CIPHERNODE_REGISTRY_CONTRACT: ''
      BONDING_REGISTRY_CONTRACT: ''
      INTERFOLD_DEPLOY_BLOCK: '0'
      CIPHERNODE_REGISTRY_DEPLOY_BLOCK: '0'
      BONDING_REGISTRY_DEPLOY_BLOCK: '0'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  ciphernode_data: {}
