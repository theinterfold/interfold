# The node derives its HTTP signer URL from its WebSocket URL. Route both transports locally.
worker_processes 1;
pid /tmp/interfold-rpc-proxy.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/interfold-rpc-client;
    proxy_temp_path /tmp/interfold-rpc-upstream;
    fastcgi_temp_path /tmp/interfold-rpc-fastcgi;
    uwsgi_temp_path /tmp/interfold-rpc-uwsgi;
    scgi_temp_path /tmp/interfold-rpc-scgi;
    # Resolve the client per request: a recreated or newly selected client can have a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $rpc_port {
        default 8545;
        websocket 8546;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 127.0.0.1:8550;
        server_tokens off;
        location / {
            proxy_pass http://${RPC_UPSTREAM_HOST}:$rpc_port;
            proxy_http_version 1.1;
            proxy_set_header Host ${RPC_UPSTREAM_HOST};
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 1d;
        }
    }
}
