[package]
name = "e3-safe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "E3 - Interfold SAFE"
repository.workspace = true

[features]
openvm = ["dep:openvm", "dep:openvm-algebra-guest", "dep:serde", "dep:num-bigint"]
phase-trace = ["openvm"]

[dependencies]
sha3 = "0.10.8"
ark-ff = { workspace = true }
ark-bn254 = { workspace = true }
taceo-poseidon2 = { version = "0.2", features = ["bn254", "t4"] }
hex = { workspace = true }
openvm-algebra-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2", optional = true }
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2", optional = true }
serde = { workspace = true, optional = true }
num-bigint = { version = "=0.4.6", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(crisp_openvm)'] }

[dev-dependencies]
rand = { workspace = true }
rand_chacha = { workspace = true }
