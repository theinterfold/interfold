[package]
name = "guests"
version = "0.1.0"
edition = "2021"
resolver = "3"
rust-version = "1.85.0"

[workspace]

[[bin]]
name = "program"
path = "src/bin/program.rs"

[dependencies]
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ['std'] }
# This revision decides which compute-provider code runs inside the zkVM, so it decides the image
# ID. It must match the pin in crates/support/Cargo.toml. See that file for why the dependency is
# pinned by revision instead of by path.
e3-compute-provider = { git = "https://github.com/theinterfold/interfold", rev = "5668f4c9ee0992aeb05b320eaa3b998a6c32e525" }
e3-support-types = { path = "../../types" }
e3-user-program = { path = "../../program" }
bincode = "=1.3.3"

[profile.release]
lto = "thin"
