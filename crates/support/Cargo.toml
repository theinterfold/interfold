[workspace]
resolver = "3"
msrv = "1.91.1"
members = ["app", "host", "types", "program"]
exclude = ["methods", "methods/guest", "openvm/guest", "openvm/prover"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
e3-support-app = { path = "./app" }
e3-support-host = { path = "./host" }
e3-user-program = { path = "./program" }
e3-support-types = { path = "./types" }
e3-fhe-params = { path = "../fhe-params" }

alloy-primitives = { version = "1.3", default-features = false, features = [
    "rlp",
    "serde",
    "std",
]}
alloy-sol-types = { version = "1.3" }
alloy-signer-local = { version = "1.0" }
anyhow = { version = "=1.0.98" }
actix-web = "=4.11.0"
bincode = { version = "=1.3.3" }
bytemuck = { version = "=1.25.0" }
env_logger = "=0.11.8"
hex = { version = "=0.4.3" }
log = { version = "=0.4.27" }
reqwest = { version = "=0.12.22", features = ["json"] }
serde = { version = "1.0", features = ["derive", "std"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sha3 = "=0.10.8"
# Build this workspace from the repository root to include the guest source dependencies.
fhe = { package = "fhe", git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.2.2" }
fhe-traits = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.2.2" }
fhe-util = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.2.2" }
e3-compute-provider = { path = "../compute-provider" }
tokio = { version = "=1.46.1", features = ["full"] }
rand = { version = "=0.9.2" }
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
url = { version = "=2.5.4" }
dotenvy = { version = "=0.15.7" }

[profile.release]
debug = 1
lto = true
