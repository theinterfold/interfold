[package]
name = "e3-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The v2 ciphernode: its engine wired to the chain, the network, jobs and keys"
repository.workspace = true

[features]
# Placeholder proofs and the JSON-configured test binary, which only test deployments may use.
testing = ["e3-jobs/testing"]

[[bin]]
name = "e3-node"
path = "src/bin/node.rs"
required-features = ["testing"]

[dependencies]
e3-blobs = { workspace = true }
e3-chain = { workspace = true }
e3-ciphernode-config = { workspace = true }
e3-crypto = { workspace = true }
e3-data-availability = { workspace = true, features = ["avail-read"] }
e3-engine = { workspace = true }
e3-entrypoint = { workspace = true }
e3-evm-contracts = { workspace = true }
e3-jobs = { workspace = true }
e3-zk-prover = { workspace = true }
e3-journal = { workspace = true }
e3-p2p = { workspace = true }
e3-protocol = { workspace = true }
e3-utils = { workspace = true }
alloy = { workspace = true }
alloy-primitives = { workspace = true }
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
alloy-sol-types = { workspace = true }
async-trait = { workspace = true }
bincode = { workspace = true }
e3-jobs = { workspace = true, features = ["testing"] }
futures = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
