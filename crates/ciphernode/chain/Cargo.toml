[package]
name = "e3-chain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The v2 node's chain adapter: contract logs in as facts, transactions out"
repository.workspace = true

[dependencies]
e3-blobs = { workspace = true }
e3-committee = { workspace = true }
e3-data-availability = { workspace = true }
e3-evm = { workspace = true }
e3-evm-contracts = { workspace = true }
futures = { workspace = true }
e3-evm-transactions = { workspace = true }
e3-protocol = { workspace = true }
alloy = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
e3-protocol = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.26"
