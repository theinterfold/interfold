[package]
name = "e3-zk-helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZK circuit helpers"
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
ark-bn254 = { workspace = true }
clap = { workspace = true }
ark-ff = { workspace = true }
e3-polynomial = { workspace = true, features = ["serde"] }
e3-safe = { workspace = true }
e3-fhe-params = { workspace = true }
fhe = { workspace = true }
fhe-math = { workspace = true }
fhe-traits = { workspace = true }
fhe-util = { workspace = true }
hex = { workspace = true }
num-bigint = { workspace = true }
num-integer = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
itertools = "0.14.0"
ndarray = { workspace = true }
e3-parity-matrix = { workspace = true }
# Circom-compatible Poseidon for the auction balance tree (matches the Noir
# `poseidon::bn254::hash_2` the app circuit uses). light-poseidon 0.2 is
# pinned to arkworks 0.4, so it gets its own renamed ark crates.
light-poseidon = "=0.2.0"
ark-bn254-04 = { package = "ark-bn254", version = "=0.4.0" }
ark-ff-04 = { package = "ark-ff", version = "=0.4.2" }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "zk_cli"
path = "src/bin/zk_cli.rs"

[[bin]]
name = "compute-vk-hash"
path = "src/bin/compute_vk_hash.rs"