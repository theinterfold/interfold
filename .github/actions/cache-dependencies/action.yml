name: Cache Rust dependencies
description: Cache Rust dependencies (cargo registry/git + target)

inputs:
  cargo-lock-path:
    description: Cargo.lock path (or glob) used to invalidate the cache key
    required: false
    default: Cargo.lock
  rust-target-path:
    description: Path to Rust target dir to cache
    required: false
    default: target/
  root-writer:
    description: Save the root target cache. Only rust-cache.yml sets it, after it drops the workspace outputs.
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: Whether an entry with the exact key was restored
    value: ${{ steps.cache.outputs.cache-hit || steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Compute cache scope
      id: cache-key
      shell: bash
      run: |
        target_path='${{ inputs.rust-target-path }}'
        target_path="${target_path#./}"
        while [[ "$target_path" == */ ]]; do target_path="${target_path%/}"; done

        if command -v sha256sum >/dev/null 2>&1; then
          scope="$(printf '%s' "$target_path" | sha256sum | cut -d' ' -f1)"
        else
          scope="$(printf '%s' "$target_path" | shasum -a 256 | cut -d' ' -f1)"
        fi

        echo "scope=$scope" >> "$GITHUB_OUTPUT"

        # Artifacts built by another compiler or with other debug-information settings are useless, so
        # the key and the restore prefix both name them.
        toolchain="${RUST_TOOLCHAIN:?Set RUST_TOOLCHAIN to the toolchain that builds the target}"
        echo "policy=rustc-${toolchain}-dev-${CARGO_PROFILE_DEV_DEBUG:-default}-test-${CARGO_PROFILE_TEST_DEBUG:-default}" >> "$GITHUB_OUTPUT"

    # .github/workflows/rust-cache.yml is the one writer of the root target cache: it saves only the
    # dependencies' artifacts. Every other job only restores it. When a pull request changed
    # Cargo.lock, each of its Rust jobs compressed several GB to save the same key, all but one failed
    # to reserve it, and the saved copy took cache space from main's. A ci run on main could also save
    # the full target under the warmer's key, and the warmer would then skip its cleanup.
    - name: Cache Rust dependencies
      id: cache
      if: inputs.rust-target-path != 'target/' || inputs.root-writer == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ inputs.rust-target-path }}
        key: rust-deps-${{ steps.cache-key.outputs.scope }}-${{ steps.cache-key.outputs.policy }}-${{ hashFiles(inputs.cargo-lock-path) }}
        restore-keys: rust-deps-${{ steps.cache-key.outputs.scope }}-${{ steps.cache-key.outputs.policy }}-

    - name: Restore Rust dependencies
      id: restore
      if: inputs.rust-target-path == 'target/' && inputs.root-writer != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ inputs.rust-target-path }}
        key: rust-deps-${{ steps.cache-key.outputs.scope }}-${{ steps.cache-key.outputs.policy }}-${{ hashFiles(inputs.cargo-lock-path) }}
        restore-keys: rust-deps-${{ steps.cache-key.outputs.scope }}-${{ steps.cache-key.outputs.policy }}-
