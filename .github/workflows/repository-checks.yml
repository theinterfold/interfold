name: Repository Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check shell syntax
        run: bash -n scripts/agent-format-hook.sh scripts/check-committee.sh scripts/check-repository.sh

      - name: Check feature containment, Docker coverage, and shutdown grace
        run: ./scripts/check-repository.sh

      - name: Check committee configuration
        run: ./scripts/check-committee.sh
