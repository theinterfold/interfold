name: Build Crisp Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - 'examples/CRISP/server/**'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'examples/CRISP/server/**'

env:
  DOCKERFILE_PATH: examples/CRISP/server/Dockerfile
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/crisp-server

permissions:
  contents: read
  packages: write

# Pull requests stay on GitHub-hosted runners. Only protected branch events use RunsOn.
# Each RunsOn label embeds run id, attempt, and job ID so jobs never share runners.
jobs:
  build:
    name: Build & Push Image
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16/spot=false', github.run_id,
      github.run_attempt, 'build') || 'ubuntu-latest' }}
    outputs:
      image_tag: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate version tag
        id: version
        run: |
          echo "version=$(date +'%Y%m%d')-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare .dockerignore
        run: cp examples/CRISP/server/.dockerignore .dockerignore

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          build-args: |
            SKIP_SOLIDITY=1
          cache-from: |
            type=gha,scope=cargo-registry
            type=gha,scope=cargo-git
            type=gha,scope=cargo-target
            type=gha,scope=buildcache
          cache-to: |
            type=gha,mode=max,scope=cargo-registry
            type=gha,mode=max,scope=cargo-git
            type=gha,mode=max,scope=cargo-target
            type=gha,mode=max,scope=buildcache
