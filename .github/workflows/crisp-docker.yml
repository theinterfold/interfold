name: Build Crisp Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    # What the image copies and compiles: the CRISP workspace and the root workspace manifests,
    # whose COPY list the Dockerfile keeps by hand. Root crate sources are compiled by ci.yml.
    paths:
      - 'examples/CRISP/server/**'
      - 'examples/CRISP/program/**'
      - 'examples/CRISP/crates/**'
      - 'examples/CRISP/.interfold/**'
      - 'examples/CRISP/Cargo.toml'
      - 'examples/CRISP/Cargo.lock'
      - 'examples/CRISP/packages/crisp-contracts/deployed_contracts.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - '.github/workflows/crisp-docker.yml'
      - '!**/*.md'
  pull_request:
    branches:
      - dev
      - main
    # What the image copies and compiles: the CRISP workspace and the root workspace manifests,
    # whose COPY list the Dockerfile keeps by hand. Root crate sources are compiled by ci.yml.
    paths:
      - 'examples/CRISP/server/**'
      - 'examples/CRISP/program/**'
      - 'examples/CRISP/crates/**'
      - 'examples/CRISP/.interfold/**'
      - 'examples/CRISP/Cargo.toml'
      - 'examples/CRISP/Cargo.lock'
      - 'examples/CRISP/packages/crisp-contracts/deployed_contracts.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - '.github/workflows/crisp-docker.yml'
      - '!**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERFILE_PATH: examples/CRISP/server/Dockerfile
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/crisp-server

permissions:
  contents: read
  packages: write

# Pull requests stay on GitHub-hosted runners. Only protected branch events use RunsOn.
# Each RunsOn label embeds run id, attempt, and job ID so jobs never share runners.
jobs:
  build:
    name: Build & Push Image
    timeout-minutes: 45
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16/spot=false', github.run_id,
      github.run_attempt, 'build') || 'ubuntu-latest' }}
    outputs:
      image_tag: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate version tag
        id: version
        run: |
          echo "version=$(date +'%Y%m%d')-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3

      # Pull requests only build the image; protected branches publish it.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare .dockerignore
        run: cp examples/CRISP/server/.dockerignore .dockerignore

      # Loaded for the smoke test, which runs before the image is published.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          build-args: |
            SKIP_SOLIDITY=1
          # One scope: each `type=gha` entry exports the whole build graph, so four scopes exported
          # it four times. Pull requests read the cache and do not write it.
          cache-from: |
            type=gha,scope=crisp-server
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=crisp-server' || '' }}

      # The server answers an unknown command with its usage, which shows that the image runs its
      # binary with the libraries that the runtime image provides. Starting the server needs an RPC
      # endpoint and deployed contracts; crisp_e2e in ci.yml runs that.
      - name: Smoke-test the image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        run: |
          if output=$(timeout 60 docker run --rm "$IMAGE" --help 2>&1); then
            echo "$output"
            echo "The server accepted an unknown command" >&2
            exit 1
          fi
          echo "$output"
          grep -q 'usage: server' <<<"$output"

      # The builder still holds every layer of the build above, so this only uploads it.
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          build-args: |
            SKIP_SOLIDITY=1
          cache-from: |
            type=gha,scope=crisp-server
