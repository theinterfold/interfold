    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Keeps the token out of .git/config, where install and build scripts could read it and use
          # this job's actions: write. The cancel step gets the token on its own.
          persist-credentials: false
          submodules: recursive

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install solc
        uses: ./.github/actions/install-solc

      - name: Build interfold CLI
        run: cargo install --locked --path crates/cli --bin interfold --features test-only-skip-proof-aggregation

      - name: Upload interfold binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interfold-binary
