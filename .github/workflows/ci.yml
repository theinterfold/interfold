    steps:
      - name: 'Check out the repo'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6
      - name: pnpm-setup
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: 'Setup node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - name: 'Install the dependencies'
        run: 'pnpm install --frozen-lockfile'
      - name: 'Download build artifacts'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-artifacts
          path: target/debug/
      - name: 'Download source-aligned ZK fixtures'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: integration-noir-artifacts
          path: tests/integration/.interfold/noir/
      - name: 'Download interfold binary'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interfold-binary
          path: ~/.cargo/bin/
      - name: 'Download SDK artifacts'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-artifacts
          path: ./
      - name: 'Verify downloaded artifacts'
        run: |
          echo "Checking for required artifacts:"
          ls -la target/debug/fake_encrypt || echo "fake_encrypt not found"
          ls -la target/debug/pack_e3_params || echo "pack_e3_params not found"
          ls -la ~/.cargo/bin/interfold || echo "interfold binary not found"
          ls -la packages/interfold-contracts/dist || echo "SDK dist not found"
          ls -la crates/wasm/dist || echo "WASM dist not found"
      - name: 'Set executable permissions'
        run: |
          chmod +x target/debug/fake_encrypt
          chmod +x target/debug/pack_e3_params
          chmod +x ~/.cargo/bin/interfold
          chmod +x tests/integration/.interfold/noir/bin/bb
      - name: 'Run ${{ matrix.test-suite }} tests'
        run: |
          INTERFOLD_BIN="$HOME/.cargo/bin/interfold" \
            pnpm test:integration ${{ matrix.test-suite }} --no-prebuild
      - name: 'Add test summary'
        run: |
          echo "## Test results for ${{ matrix.test-suite }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

  build_interfold_cli:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.build_interfold_cli == 'true'
    timeout-minutes: 20
    runs-on:
      group: enclave-ci
      labels: [enclave-ci-runner]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Keeps the token out of .git/config, where install and build scripts could read it and use
          # this job's actions: write. The cancel step gets the token on its own.
          persist-credentials: false
          submodules: recursive

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install solc
        uses: ./.github/actions/install-solc

      - name: Build interfold CLI
        run: cargo install --locked --path crates/cli --bin interfold --features test-only-skip-proof-aggregation

      - name: Upload interfold binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interfold-binary
          path: ~/.cargo/bin/interfold
          retention-days: 1

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  crisp_unit_circuits:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.crisp_unit_circuits == 'true'
    timeout-minutes: 15
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'crisp_unit_circuits') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Install Nargo
        uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Run circuit tests
        working-directory: ./examples/CRISP/circuits/lib
        run: nargo test

  crisp_unit_rust:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.crisp_unit_rust == 'true'
    timeout-minutes: 20
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'crisp_unit_rust') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies
        with:
          cargo-lock-path: examples/CRISP/Cargo.lock
          rust-target-path: examples/CRISP/target/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Install solc
        uses: ./.github/actions/install-solc

      - name: Run cargo test
        working-directory: ./examples/CRISP
        run: cargo test

  crisp_unit_sdk:
    needs: [detect_changes, build_crisp_sdk]
    if: needs.detect_changes.outputs.crisp_unit_sdk == 'true'
    timeout-minutes: 20
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'crisp_unit_sdk') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Download Crisp SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crisp-sdk-artifacts
          path: .

      # One test proves a ballot. The contract suite proves every other ballot kind through this SDK.
      - name: Run SDK tests
        working-directory: ./examples/CRISP
        run: pnpm test:sdk

  crisp_unit_contracts:
    needs: [detect_changes, build_crisp_sdk]
    if: needs.detect_changes.outputs.crisp_unit_contracts == 'true'
    # Use a timeout for each leg because the workloads differ. Tests that generate a ballot prove
    # five Noir circuits and can take several minutes. Other tests complete in seconds.
    timeout-minutes: ${{ matrix.timeout }}
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}-{3}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'crisp_unit_contracts', matrix['test-suite']) || 'ubuntu-latest' }}
    strategy:
      matrix:
        include:
          # The contract suite is split by proving cost, not by subject. Run whole it took 27m54s
          # against a 30m cap and started dying to ordinary runner variance, and it grows by minutes
          # with every ballot a new test needs. Split, the critical path is the largest single leg
          # rather than the sum, and the checks that prove nothing report in seconds instead of
          # queueing behind twenty minutes of proving.
          #
          # `pnpm test:contracts` still runs all of it in one go for local use, and
          # `check:test-legs` fails if a test file ever belongs to no leg.
          #
          # input-tree: the poisoned-parent case proves three ballots and runs alone. The canonical
          # group's negative match keeps every new test in it.
          - test-suite: test:contracts:input-tree:poisoned-parent
            timeout: 30
          - test-suite: test:contracts:input-tree:canonical
            timeout: 30
          # ballots: crisp.contracts.test.ts and onchain-census.test.ts each prove two ballots.
          - test-suite: test:contracts:ballots:program
            timeout: 30
          - test-suite: test:contracts:ballots:census
            timeout: 30
          - test-suite: test:contracts:unit
            timeout: 15
      fail-fast: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # `hardhat.config.ts` imports `@interfold/contracts/tasks/*`, which resolves only after
      # `evm:build` writes `dist/`.
      - name: Compile Interfold contracts
        working-directory: .
        run: pnpm evm:build

      # Each leg has at least one test that imports `@crisp-e3/sdk`.
      - name: Download Crisp SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crisp-sdk-artifacts
          path: .

      - name: Run ${{ matrix.test-suite }}
        working-directory: ./examples/CRISP
        run: pnpm ${{ matrix.test-suite }}

  crisp_e2e:
    needs: [detect_changes, build_interfold_cli, build_crisp_sdk]
    if: needs.detect_changes.outputs.crisp_e2e == 'true'
    timeout-minutes: 45
    runs-on:
      group: enclave-ci
      labels: [enclave-ci-runner]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies
        with:
          cargo-lock-path: examples/CRISP/Cargo.lock
          rust-target-path: examples/CRISP/target/

      - name: Prepare test environment
        run: |
          mkdir -p $GITHUB_WORKSPACE/examples/CRISP/test-results
          sudo chmod -R 777 $GITHUB_WORKSPACE/examples/CRISP/test-results
          mkdir -p $GITHUB_WORKSPACE/examples/CRISP/playwright-report
          sudo chmod -R 777 $GITHUB_WORKSPACE/examples/CRISP/playwright-report
          mkdir -p $GITHUB_WORKSPACE/examples/CRISP/.cache-synpress
          sudo chown -R $USER_UID:$USER_GID $GITHUB_WORKSPACE/examples/CRISP/.cache-synpress
          sudo chmod -R 777 $GITHUB_WORKSPACE/examples/CRISP/.cache-synpress

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install solc
        uses: ./.github/actions/install-solc

      - name: Install yq
        run: |
          archive="${RUNNER_TEMP}/yq.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --retry-max-time 300 https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64.tar.gz -o "$archive"
          sudo tar xzf "$archive" -C /usr/local/bin --transform='s|yq_linux_amd64|yq|' --no-same-owner

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Compile Interfold contracts
        working-directory: .
        run: pnpm evm:build

      - name: Compile Crisp contracts
        working-directory: ./examples/CRISP
        run: pnpm compile:contracts

      - name: Copy environment variables
        working-directory: ./examples/CRISP
        run: |
          cp server/.env.example server/.env
          cp client/.env.example client/.env
          cp .env.example .env

      - name: Build Crisp server and CLI binaries
        working-directory: ./examples/CRISP/server
        run: |
          cargo build --locked --bin cli
          cargo build --locked --bin server

      - name: Download Crisp SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crisp-sdk-artifacts
          path: .

      - name: Install Playwright browsers
        working-directory: ./examples/CRISP
        run: pnpm exec playwright install chromium

      - name: Download interfold binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interfold-binary
          path: ~/.cargo/bin/

      - name: Make binaries executable
        run: |
          chmod +x ~/.cargo/bin/interfold

      - name: Install Nargo
        uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Cache Barretenberg binary
        id: cache-bb
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/bin/bb
          key: bb-bin-${{ env.BB_VERSION }}-amd64-linux

      - name: Install Barretenberg (bb)
        if: steps.cache-bb.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --retry-max-time 600 \
            "https://github.com/AztecProtocol/aztec-packages/releases/download/v${{ env.BB_VERSION }}/barretenberg-amd64-linux.tar.gz" -o bb.tar.gz
          mkdir -p bb_extract && tar -xzf bb.tar.gz -C bb_extract
          BB_BIN=$(find bb_extract -name bb -type f | head -n 1)
          sudo mv "$BB_BIN" /usr/local/bin/bb
          chmod +x /usr/local/bin/bb

      - name: Build interfold circuits
        run: pnpm build:circuits --preset insecure-512 --committee minimum --skip-if-built

      - name: Install and verify candidate circuits
        working-directory: ./examples/CRISP
        run: |
          tar -C "$GITHUB_WORKSPACE/dist" -czf "$RUNNER_TEMP/circuits-candidate.tar.gz" circuits/
          interfold noir setup --circuits-archive "$RUNNER_TEMP/circuits-candidate.tar.gz" \
            --circuits-configuration insecure-512/minimum
          interfold noir setup

      - name: Run Playwright tests
        working-directory: ./examples/CRISP
        env:
          PLAYWRIGHT_WORKERS: 4
          METAMASK_VERSION: 11.8.2
        run: pnpm test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: ./examples/CRISP/playwright-report/
          retention-days: 30

  noir_checks:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.noir_checks == 'true'
    timeout-minutes: 15
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'noir_checks') || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Keeps the token out of .git/config, where install and build scripts could read it and use
          # this job's actions: write. The cancel step gets the token on its own.
          persist-credentials: false

      - name: Install Nargo
        uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Check formatting
        run: ./scripts/lint-circuits.sh

      - name: Test Noir circuits
        run: ./scripts/test-circuits.sh

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  build_circuits:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.build_circuits == 'true'
    timeout-minutes: 45
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'build_circuits') || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Keeps the token out of .git/config, where install and build scripts could read it and use
          # this job's actions: write. The cancel step gets the token on its own.
          persist-credentials: false
          submodules: recursive

      - name: Install Nargo
        uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      - name: Cache Barretenberg binary
        id: cache-bb
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/bin/bb
          key: bb-bin-${{ env.BB_VERSION }}-amd64-linux

      - name: Install Barretenberg (bb)
        if: steps.cache-bb.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --retry-max-time 600 \
            "https://github.com/AztecProtocol/aztec-packages/releases/download/v${{ env.BB_VERSION }}/barretenberg-amd64-linux.tar.gz" -o bb.tar.gz
          mkdir -p bb_extract && tar -xzf bb.tar.gz -C bb_extract
          BB_BIN=$(find bb_extract -name bb -type f | head -n 1)
          sudo mv "$BB_BIN" /usr/local/bin/bb
          chmod +x /usr/local/bin/bb

      - name: Verify bb
        run: bb --version

      - name: pnpm-setup
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build circuits
        run: pnpm build:circuits

      - name: Check generated circuit sources are committed
        run: |
          git diff --exit-code -- \
            circuits/lib/src/configs \
            packages/interfold-contracts/contracts/lib/ActiveCryptoConfig.sol \
            packages/interfold-contracts/scripts/utils.ts

      - name: Test circuit artifact validation and verifier selection
        run: pnpm test:circuit-tooling

      # The generated verifier contracts must match the freshly built verification keys. A drift
      # means the deployed verifier accepts a different circuit from the one in this tree.
      #
      # `--no-compile`: without it the checker deletes every nargo target directory first, its guard
      # against comparing stale artifacts, and recompiles them. The step above has just built these
      # circuits, so there is nothing stale to guard against.
      - name: Check generated verifiers are in sync
        run: pnpm check:verifiers --no-compile

      # Release workflows also verify the promoted six-pair circuit matrix.
      - name: Pull the complete circuit matrix
        run: pnpm store:circuits pull

      - name: Verify release circuit provenance
        run: pnpm store:circuits verify-release

      - name: Check every generated BFV verifier
        run: |
          while read -r preset committee
          do
            pnpm build:circuits \
              --preset "$preset" \
              --committee "$committee" \
              --hydrate-bin-only \
              --no-clean-targets
            pnpm generate:verifiers \
              --circuits dkg_aggregator,decryption_aggregator \
              --preset "$preset" \
              --committee "$committee" \
              --check \
              --no-compile
          done <<'EOF'
          insecure-512 micro
          insecure-512 small
          secure-8192 minimum
          secure-8192 micro
          secure-8192 small
          insecure-512 minimum
          EOF

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # Proves with the published circuit set for this tree's SOURCE_HASH, which is also what
  # `build_circuits` used to hand over: it pulled and hydrated the published set before uploading.
  # Pulling here removes the wait for `build_circuits`, which still compiles from source and checks
  # every published pair's verifiers. The proof suites run in two legs; the correlated node test
  # alone sets the floor.
  zk_prover_e2e:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.zk == 'true'
    timeout-minutes: 60
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}-{3}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'zk_prover_e2e', matrix.leg) || 'ubuntu-latest' }}
    strategy:
      matrix:
        leg: [suites, node-fold]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Nargo
        uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Cache Barretenberg binary
        id: cache-bb
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/bin/bb
          key: bb-bin-${{ env.BB_VERSION }}-amd64-linux

      - name: Install solc
        uses: ./.github/actions/install-solc

      - name: Install Barretenberg (bb)
        if: steps.cache-bb.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --retry-max-time 600 \
            "https://github.com/AztecProtocol/aztec-packages/releases/download/v${{ env.BB_VERSION }}/barretenberg-amd64-linux.tar.gz" -o bb.tar.gz
          mkdir -p bb_extract && tar -xzf bb.tar.gz -C bb_extract
          BB_BIN=$(find bb_extract -name bb -type f | head -n 1)
          sudo mv "$BB_BIN" /usr/local/bin/bb
          chmod +x /usr/local/bin/bb

      - name: Verify bb
        run: bb --version

      - name: pnpm-setup
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails when no published set matches the tree, as `build_circuits` does.
      - name: Pull the published circuits
        timeout-minutes: 10
        run: pnpm store:circuits pull

      - name: Hydrate the insecure-512/minimum circuits
        run: pnpm build:circuits --preset insecure-512 --committee minimum --hydrate-bin-only --no-clean-targets

      - name: Verify circuit artifacts
        run: |
          echo "DKG circuits:"
          ls -la circuits/bin/dkg/target/*.json \
               circuits/bin/dkg/target/*.vk \
               circuits/bin/dkg/target/*.vk_hash \
               circuits/bin/dkg/target/*.vk_recursive \
               circuits/bin/dkg/target/*.vk_recursive_hash \
               circuits/bin/dkg/target/*.vk_noir \
               circuits/bin/dkg/target/*.vk_noir_hash
          echo "Threshold circuits:"
          ls -la circuits/bin/threshold/target/*.json \
               circuits/bin/threshold/target/*.vk \
               circuits/bin/threshold/target/*.vk_hash \
               circuits/bin/threshold/target/*.vk_recursive \
               circuits/bin/threshold/target/*.vk_recursive_hash \
               circuits/bin/threshold/target/*.vk_noir \
               circuits/bin/threshold/target/*.vk_noir_hash

      - name: Verify variant output directories
        run: |
          echo "Checking recursive aggregation artifacts:"
          # Assert on the artifacts downstream jobs consume. Listing alone let this step
          # pass even when no recursive artifacts had been produced at all.
          for artifact in \
            circuits/bin/recursive_aggregation/dkg_aggregator/target/dkg_aggregator.json \
            circuits/bin/recursive_aggregation/dkg_aggregator/target/dkg_aggregator.vk_recursive \
            circuits/bin/recursive_aggregation/decryption_aggregator/target/decryption_aggregator.json \
            circuits/bin/recursive_aggregation/decryption_aggregator/target/decryption_aggregator.vk_recursive
          do
            test -f "$artifact" || { echo "Missing required artifact: $artifact"; exit 1; }
            echo "  ok $artifact"
          done

      - name: Run ZK prover e2e tests
        if: matrix.leg == 'suites'
        run: cargo test -p e3-zk-prover --test local_e2e_tests -- --nocapture --test-threads=1

      - name: Verify C0 recovery after local verifier errors
        if: matrix.leg == 'suites'
        run: cargo test -p e3-zk-prover --lib c0_local_verifier_failures_retry_without_peer_blame -- --nocapture

      - name: Verify fold accumulators
        if: matrix.leg == 'suites'
        timeout-minutes: 30
        run: cargo test --locked -p e3-zk-prover --test fold_accumulators_e2e_tests -- --include-ignored --nocapture --test-threads=1

      - name: Verify the correlated node proof
        if: matrix.leg == 'node-fold'
        timeout-minutes: 30
        run: cargo test --locked -p e3-zk-prover --test node_fold_correlated_e2e_tests -- --include-ignored --nocapture --test-threads=1

  build_e3_support_dev:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.build_e3_support_dev == 'true'
    timeout-minutes: 20
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'build_e3_support_dev') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies
        with:
          cargo-lock-path: templates/default/Cargo.lock
          rust-target-path: templates/default/target/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install protoc
        uses: ./.github/actions/install-protoc
      # The e3-support-scripts tests run in rust_unit_tests: every input of that crate selects it.
      - name: Build support scripts
        run: cd templates/default && cargo build --locked --bin e3-support-scripts-dev
      # The OpenVM proving service links the template program. Its guest needs cargo-openvm and a GPU
      # host for proofs, so CI builds only the service.
      - name: Build the OpenVM proving service
        run: cd templates/default && cargo build --locked --bin e3-support-scripts-openvm
      - name: Verify build artifacts
        run: |
          echo "Checking for support scripts binary:"
          find templates/default/target/ -name "e3-support-scripts-dev" -type f -ls || echo "Binary not found"
      - name: Upload support scripts artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: support-scripts-artifacts
          # Only the binary. template_integration is the one consumer and needs nothing else from
          # the cargo target directory.
          path: templates/default/target/debug/e3-support-scripts-dev
          retention-days: 1
          if-no-files-found: error

  # The CPU build of the OpenVM worker and its tests. Proofs and the CUDA build need a GPU host.
  openvm_worker:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.openvm_worker == 'true'
    timeout-minutes: 45
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'openvm_worker') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies
        with:
          cargo-lock-path: crates/openvm-prover/Cargo.lock
          rust-target-path: crates/openvm-prover/target/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Test the CPU worker
        run: cargo test --locked --manifest-path crates/openvm-prover/Cargo.toml

  # Builds both OpenVM guests, which compiles the guest-only code paths, then runs CRISP's guest on a
  # fresh fixture without proving and compares the digest it reveals with the native journal.
  openvm_guest:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.openvm_guest == 'true'
    timeout-minutes: 75
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'openvm_guest') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies
        with:
          cargo-lock-path: examples/CRISP/**/Cargo.lock
          rust-target-path: target/openvm/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install protoc
        uses: ./.github/actions/install-protoc
      - name: Install the OpenVM guest toolchain
        run: rustup toolchain install nightly-2026-01-18 --component rust-src
      # The published binary of the pinned release, checked against its SHA-256. Building it from
      # source took 7-9 minutes whenever its cache missed.
      - name: Install cargo-openvm
        run: |
          archive="${RUNNER_TEMP}/cargo-openvm.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --retry-max-time 600 \
            https://github.com/openvm-org/openvm/releases/download/v2.0.2/cargo-openvm-v2.0.2-x86_64-unknown-linux-gnu.tar.gz \
            -o "${archive}"
          echo "c2a1d63a96c093a4969c799f3021fb991b0c51f56b53f26e3468d2d13676de2f  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C ~/.cargo/bin cargo-openvm
          cargo openvm --version
      - name: Build the template guest
        working-directory: templates/default/guest
        env:
          OPENVM_BUILD_LOCKED: '1'
          RUSTFLAGS: --cfg crisp_openvm --cfg crisp_fhe_optimized
        run: cargo openvm build --target-dir ../../../target/openvm/template-guest
      # The guest replaces hashing, packing and commitments with accelerated versions that the host
      # does not run. The secure fixture covers their secure-8192 widths.
      - name: Run the CRISP guest against the native journal
        run: |
          bash scripts/run-openvm.sh fixture 3 "$RUNNER_TEMP/crisp-fixture" --insecure
          bash scripts/run-openvm.sh guest-parity "$RUNNER_TEMP/crisp-fixture"
          bash scripts/run-openvm.sh fixture 2 "$RUNNER_TEMP/crisp-fixture-secure"
          bash scripts/run-openvm.sh guest-parity "$RUNNER_TEMP/crisp-fixture-secure"

  build_sdk:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.build_sdk == 'true'
    timeout-minutes: 30
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'build_sdk') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Nargo
        uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the sdk
        run: pnpm sdk:build

      - name: Build the React package
        run: pnpm react:build

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-artifacts
          include-hidden-files: true
          path: |
            packages/interfold-sdk/dist
            packages/interfold-contracts/dist
            packages/interfold-contracts/artifacts
            packages/interfold-contracts/cache
            packages/interfold-contracts/types
            crates/wasm/dist
            circuits/bin/.active-preset.json
            circuits/bin/recursive_aggregation/*/target
            circuits/bin/threshold/target
          retention-days: 1
          if-no-files-found: error

  # The SDK tests read only the outputs that build_sdk uploads: the SDK, WASM and contract builds and
  # the threshold circuits. In their own job, they no longer hold back the jobs that download them.
  sdk_tests:
    needs: [detect_changes, build_sdk]
    if: needs.detect_changes.outputs.sdk_tests == 'true'
    timeout-minutes: 30
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'sdk_tests') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Download SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-artifacts
          path: ./

      - name: Test the SDK
        uses: ./.github/actions/sdk-tests

  build_crisp_sdk:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.build_crisp_sdk == 'true'
    timeout-minutes: 20
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'build_crisp_sdk') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Nargo
        uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      # The preset build runs the root circuit tools (scripts/build-circuits.ts), which took about two
      # and a half of this step's six minutes when built from scratch. rust-cache.yml warms them.
      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the sdk
        working-directory: ./examples/CRISP
        run: pnpm build:sdk

      - name: Install Chrome for WASM browser smoke tests
        uses: browser-actions/setup-chrome@19ae4b339ee18925ab85cf12c1041150ea4a44c8 # v1

      # `pnpm build:sdk` already built crisp-zk-inputs through `build:wasm`.
      - name: WASM browser smoke test (crisp-zk-inputs)
        working-directory: ./examples/CRISP
        run: pnpm -C packages/crisp-zk-inputs test:browser

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crisp-sdk-artifacts
          path: |
            examples/CRISP/packages/crisp-sdk/dist
            examples/CRISP/packages/crisp-zk-inputs/dist
            examples/CRISP/circuits/bin/crisp/target
            examples/CRISP/circuits/bin/crisp_onchain/target
            examples/CRISP/circuits/bin/fold/target
            examples/CRISP/circuits/bin/fold_onchain/target
            circuits/bin/threshold/target
            circuits/bin/recursive_aggregation/*/target
          retention-days: 1
          if-no-files-found: warn

  template_integration:
    needs: [detect_changes, build_interfold_cli, build_e3_support_dev, build_sdk]
    if: needs.detect_changes.outputs.templates == 'true'
    timeout-minutes: 30
    runs-on:
      group: enclave-ci
      labels: [enclave-ci-runner]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Download interfold binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interfold-binary
          path: ~/.cargo/bin/

      - name: Download support scripts artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: support-scripts-artifacts
          path: templates/default/target/debug/

      - name: Download SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-artifacts
          path: ./

      - name: Make binaries executable
        run: |
          chmod +x ~/.cargo/bin/interfold
          chmod +x templates/default/target/debug/e3-support-scripts-dev

      - name: Install Nargo
        uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Cache Barretenberg binary
        id: cache-bb
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/bin/bb
          key: bb-bin-${{ env.BB_VERSION }}-amd64-linux

      - name: Install Barretenberg (bb)
        if: steps.cache-bb.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --retry-max-time 600 \
            "https://github.com/AztecProtocol/aztec-packages/releases/download/v${{ env.BB_VERSION }}/barretenberg-amd64-linux.tar.gz" -o bb.tar.gz
          mkdir -p bb_extract && tar -xzf bb.tar.gz -C bb_extract
          BB_BIN=$(find bb_extract -name bb -type f | head -n 1)
          sudo mv "$BB_BIN" /usr/local/bin/bb
          chmod +x /usr/local/bin/bb

      - name: Build interfold circuits
        run: pnpm build:circuits --preset insecure-512 --committee minimum --skip-if-built

      - name: Install and verify candidate circuits
        working-directory: ./templates/default
        run: |
          tar -C "$GITHUB_WORKSPACE/dist" -czf "$RUNNER_TEMP/circuits-candidate.tar.gz" circuits/
          interfold noir setup --circuits-archive "$RUNNER_TEMP/circuits-candidate.tar.gz" \
            --circuits-configuration insecure-512/minimum
          interfold noir setup

      - name: Verify downloaded artifacts
        run: |
          echo "Checking downloaded artifacts:"
          ls -la ~/.cargo/bin/interfold || echo "interfold binary not found"
          ls -la templates/default/target/debug/e3-support-scripts-dev || echo "support scripts not found"
          ls -la packages/interfold-contracts/dist || echo "SDK dist not found"
          ls -la crates/wasm/dist || echo "WASM dist not found"
          test -f circuits/bin/.active-preset.json || (echo "ERROR: circuit preset stamp not found" && exit 1)
          echo "Support scripts permissions:"
          ls -la templates/default/target/debug/e3-support-scripts-dev

      - name: Test Template
        run: |
          cd templates/default
          pnpm compile
          pnpm test:integration

  test_interfold_init:
    needs: [detect_changes, build_interfold_cli]
    if: needs.detect_changes.outputs.init == 'true'
    timeout-minutes: 10
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'test_interfold_init') || 'ubuntu-latest' }}
    steps:
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.7.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Download interfold binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interfold-binary
          path: ~/.cargo/bin/
      - name: Make binaries executable
        run: |
          chmod +x ~/.cargo/bin/interfold
      - name: Verify downloaded artifacts
        run: |
          ls -la ~/.cargo/bin/interfold || echo "interfold binary not found"
      - name: Interfold init
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          UPSTREAM_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="$HEAD_REF"
            TEMPLATE_REPO="$HEAD_REPO_URL"
          else
            BRANCH="$REF_NAME"
            TEMPLATE_REPO="$UPSTREAM_REPO_URL"
          fi
          interfold init mycitest --verbose --skip-install --template="${TEMPLATE_REPO}#${BRANCH}:templates/default"

          VERSION=$(interfold --version | awk '{print $2}')
          grep -F "\"@interfold/contracts\": \"$VERSION\"" mycitest/package.json
          grep -F "\"@interfold/sdk\": \"$VERSION\"" mycitest/package.json
          grep -F "\"@interfold/react\": \"$VERSION\"" mycitest/client/package.json
          grep -F "\"@interfold/sdk\": \"$VERSION\"" mycitest/client/package.json
