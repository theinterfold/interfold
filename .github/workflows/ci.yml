  build_circuits:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.build_circuits == 'true'
    timeout-minutes: 45
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'build_circuits') || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Keeps the token out of .git/config, where install and build scripts could read it and use
          # this job's actions: write. The cancel step gets the token on its own.
          persist-credentials: false
          submodules: recursive

      - name: Install Nargo
        uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      - name: Cache Barretenberg binary
        id: cache-bb
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/bin/bb
          key: bb-bin-${{ env.BB_VERSION }}-amd64-linux

      - name: Install Barretenberg (bb)
        if: steps.cache-bb.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --retry-max-time 600 \
            "https://github.com/AztecProtocol/aztec-packages/releases/download/v${{ env.BB_VERSION }}/barretenberg-amd64-linux.tar.gz" -o bb.tar.gz
          mkdir -p bb_extract && tar -xzf bb.tar.gz -C bb_extract
          BB_BIN=$(find bb_extract -name bb -type f | head -n 1)
          sudo mv "$BB_BIN" /usr/local/bin/bb
          chmod +x /usr/local/bin/bb

      - name: Verify bb
        run: bb --version

      - name: pnpm-setup
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build circuits
        run: pnpm build:circuits

      - name: Check generated circuit sources are committed
        run: |
          git diff --exit-code -- \
            circuits/lib/src/configs \
            packages/interfold-contracts/contracts/lib/ActiveCryptoConfig.sol \
            packages/interfold-contracts/scripts/utils.ts

      - name: Test circuit artifact validation and verifier selection
        run: pnpm test:circuit-build -- --include-ignored && pnpm test:circuit-tooling

      # The generated verifier contracts must match the freshly built verification keys. A drift
      # means the deployed verifier accepts a different circuit from the one in this tree.
      #
      # `--no-compile`: without it the checker deletes every nargo target directory first, its guard
      # against comparing stale artifacts, and recompiles them. The step above has just built these
      # circuits, so there is nothing stale to guard against.
      - name: Check generated verifiers are in sync
        run: pnpm check:verifiers --no-compile

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # Proves with the newest published circuit set without a local SOURCE_HASH match.
  # Source builds still compile and check their selected pair. Releases verify the complete matrix.
  # The proof suites run in two legs; the correlated node test alone sets the floor.
  zk_prover_e2e:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.zk == 'true'
    timeout-minutes: 60
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}-{3}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'zk_prover_e2e', matrix.leg) || 'ubuntu-latest' }}
    strategy:
      matrix:
        leg: [suites, node-fold]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Nargo
        uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Cache Barretenberg binary
        id: cache-bb
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/bin/bb
          key: bb-bin-${{ env.BB_VERSION }}-amd64-linux

      - name: Install solc
        uses: ./.github/actions/install-solc

      - name: Install Barretenberg (bb)
        if: steps.cache-bb.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --retry-max-time 600 \
            "https://github.com/AztecProtocol/aztec-packages/releases/download/v${{ env.BB_VERSION }}/barretenberg-amd64-linux.tar.gz" -o bb.tar.gz
          mkdir -p bb_extract && tar -xzf bb.tar.gz -C bb_extract
          BB_BIN=$(find bb_extract -name bb -type f | head -n 1)
          sudo mv "$BB_BIN" /usr/local/bin/bb
          chmod +x /usr/local/bin/bb

      - name: Verify bb
        run: bb --version

      - name: pnpm-setup
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Non-release proof suites reuse the published branch tip.
      - name: Pull the published circuits
        timeout-minutes: 10
        run: pnpm store:circuits pull --latest

      - name: Hydrate the insecure-64/minimum circuits
        run: pnpm build:circuits --preset insecure-64 --committee minimum --hydrate-bin-only --no-clean-targets

      - name: Verify circuit artifacts
        run: |
          echo "DKG circuits:"
          ls -la circuits/bin/dkg/target/*.json \
               circuits/bin/dkg/target/*.vk \
               circuits/bin/dkg/target/*.vk_hash \
               circuits/bin/dkg/target/*.vk_recursive \
               circuits/bin/dkg/target/*.vk_recursive_hash \
               circuits/bin/dkg/target/*.vk_noir \
               circuits/bin/dkg/target/*.vk_noir_hash
          echo "Threshold circuits:"
          ls -la circuits/bin/threshold/target/*.json \
               circuits/bin/threshold/target/*.vk \
               circuits/bin/threshold/target/*.vk_hash \
               circuits/bin/threshold/target/*.vk_recursive \
               circuits/bin/threshold/target/*.vk_recursive_hash \
               circuits/bin/threshold/target/*.vk_noir \
               circuits/bin/threshold/target/*.vk_noir_hash

      - name: Verify variant output directories
        run: |
          echo "Checking recursive aggregation artifacts:"
          # Assert on the artifacts downstream jobs consume. Listing alone let this step
          # pass even when no recursive artifacts had been produced at all.
          for artifact in \
            circuits/bin/recursive_aggregation/dkg_aggregator/target/dkg_aggregator.json \
            circuits/bin/recursive_aggregation/dkg_aggregator/target/dkg_aggregator.vk_recursive \
            circuits/bin/recursive_aggregation/decryption_aggregator/target/decryption_aggregator.json \
            circuits/bin/recursive_aggregation/decryption_aggregator/target/decryption_aggregator.vk_recursive
          do
            test -f "$artifact" || { echo "Missing required artifact: $artifact"; exit 1; }
            echo "  ok $artifact"
          done

      - name: Check C6/C7 witness and ABI compatibility
        if: matrix.leg == 'suites'
        run: cargo test --locked -p e3-zk-prover --test witness_compatibility -- --include-ignored --nocapture

      - name: Run ZK prover e2e tests
        if: matrix.leg == 'suites'
        run: cargo test -p e3-zk-prover --test local_e2e_tests -- --nocapture --test-threads=1

      - name: Verify C0 recovery after local verifier errors
        if: matrix.leg == 'suites'
        run: cargo test -p e3-zk-prover --lib c0_local_verifier_failures_retry_without_peer_blame -- --nocapture

      - name: Verify fold accumulators
        if: matrix.leg == 'suites'
        timeout-minutes: 30
        run: cargo test --locked -p e3-zk-prover --test fold_accumulators_e2e_tests -- --include-ignored --nocapture --test-threads=1

      - name: Verify the correlated node proof
        if: matrix.leg == 'node-fold'
        timeout-minutes: 30
        run: cargo test --locked -p e3-zk-prover --test node_fold_correlated_e2e_tests -- --include-ignored --nocapture --test-threads=1

  build_e3_support_dev:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.build_e3_support_dev == 'true'
    timeout-minutes: 20
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'build_e3_support_dev') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies
        with:
          cargo-lock-path: templates/default/Cargo.lock
          rust-target-path: templates/default/target/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install protoc
        uses: ./.github/actions/install-protoc
      # The e3-cli and e3-program-runner tests run in rust_unit_tests: every input of
      # those crates selects it. One binary serves both the development runner and the OpenVM
      # proving service; the OpenVM guest needs cargo-openvm and a GPU host for proofs, so CI builds
      # only the runner.
      - name: Build the program runner
        run: cd templates/default && cargo build --locked --bin program-runner
      - name: Verify build artifacts
        run: |
          echo "Checking for the program runner binary:"
          find templates/default/target/ -name "program-runner" -type f -ls || echo "Binary not found"
      - name: Upload the program runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: program-runner-artifacts
          # Only the binary. template_integration is the one consumer and needs nothing else from
          # the cargo target directory.
          path: templates/default/target/debug/program-runner
          retention-days: 1
          if-no-files-found: error

  # The CPU build of the OpenVM worker and its tests. Proofs and the CUDA build need a GPU host.
  openvm_worker:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.openvm_worker == 'true'
    timeout-minutes: 45
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'openvm_worker') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies
        with:
          cargo-lock-path: crates/openvm-prover/Cargo.lock
          rust-target-path: crates/openvm-prover/target/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Test the CPU worker
        run: cargo test --locked --manifest-path crates/openvm-prover/Cargo.toml

  # Builds the template OpenVM guest, which compiles the guest-only code paths.
  openvm_guest:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.openvm_guest == 'true'
    timeout-minutes: 75
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'openvm_guest') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies
        with:
          cargo-lock-path: templates/default/guest/Cargo.lock
          rust-target-path: target/openvm/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install protoc
        uses: ./.github/actions/install-protoc
      - name: Install the OpenVM guest toolchain
        run: rustup toolchain install nightly-2026-01-18 --component rust-src
      # The published binary of the pinned release, checked against its SHA-256. Building it from
      # source took 7-9 minutes whenever its cache missed.
      - name: Install cargo-openvm
        run: |
          archive="${RUNNER_TEMP}/cargo-openvm.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --retry-max-time 600 \
            https://github.com/openvm-org/openvm/releases/download/v2.0.2/cargo-openvm-v2.0.2-x86_64-unknown-linux-gnu.tar.gz \
            -o "${archive}"
          echo "c2a1d63a96c093a4969c799f3021fb991b0c51f56b53f26e3468d2d13676de2f  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C ~/.cargo/bin cargo-openvm
          cargo openvm --version
      - name: Build the template guest
        working-directory: templates/default/guest
        env:
          OPENVM_BUILD_LOCKED: '1'
          RUSTFLAGS: --cfg crisp_openvm --cfg crisp_fhe_optimized
        run: cargo openvm build --target-dir ../../../target/openvm/template-guest

  build_sdk:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.build_sdk == 'true'
    timeout-minutes: 30
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'build_sdk') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Nargo
        uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the sdk
        run: pnpm sdk:build

      - name: Build the React package
        run: pnpm react:build

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-artifacts
          include-hidden-files: true
          path: |
            packages/interfold-sdk/dist
            packages/interfold-contracts/dist
            packages/interfold-contracts/artifacts
            packages/interfold-contracts/cache
            packages/interfold-contracts/types
            crates/wasm/dist
            circuits/bin/.active-preset.json
            circuits/bin/recursive_aggregation/*/target
            circuits/bin/threshold/target
          retention-days: 1
          if-no-files-found: error

  # The SDK tests read only the outputs that build_sdk uploads: the SDK, WASM and contract builds and
  # the threshold circuits. In their own job, they no longer hold back the jobs that download them.
  sdk_tests:
    needs: [detect_changes, build_sdk]
    if: needs.detect_changes.outputs.sdk_tests == 'true'
    timeout-minutes: 30
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'sdk_tests') || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Keeps the token out of .git/config, where install and build scripts could read it and use
          # this job's actions: write. The cancel step gets the token on its own.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Download SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-artifacts
          path: ./

      - name: Test the SDK
        uses: ./.github/actions/sdk-tests

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  template_integration:
    needs: [detect_changes, build_interfold_cli, build_e3_support_dev, build_sdk]
    if: needs.detect_changes.outputs.templates == 'true'
    timeout-minutes: 30
    runs-on:
      group: enclave-ci
      labels: [enclave-ci-runner]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Download interfold binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interfold-binary
          path: ~/.cargo/bin/

      - name: Download the program runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: program-runner-artifacts
          path: templates/default/target/debug/

      - name: Download SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-artifacts
          path: ./

      - name: Make binaries executable
        run: |
          chmod +x ~/.cargo/bin/interfold
          chmod +x templates/default/target/debug/program-runner

      - name: Install Nargo
        uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Cache Barretenberg binary
        id: cache-bb
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/bin/bb
          key: bb-bin-${{ env.BB_VERSION }}-amd64-linux

      - name: Install Barretenberg (bb)
        if: steps.cache-bb.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --retry-max-time 600 \
            "https://github.com/AztecProtocol/aztec-packages/releases/download/v${{ env.BB_VERSION }}/barretenberg-amd64-linux.tar.gz" -o bb.tar.gz
          mkdir -p bb_extract && tar -xzf bb.tar.gz -C bb_extract
          BB_BIN=$(find bb_extract -name bb -type f | head -n 1)
          sudo mv "$BB_BIN" /usr/local/bin/bb
          chmod +x /usr/local/bin/bb

      - name: Build interfold circuits
        run: pnpm build:circuits --preset insecure-64 --committee minimum --skip-if-built

      - name: Install and verify candidate circuits
        working-directory: ./templates/default
        run: |
          tar -C "$GITHUB_WORKSPACE/dist" -czf "$RUNNER_TEMP/circuits-candidate.tar.gz" circuits/
          interfold noir setup --circuits-archive "$RUNNER_TEMP/circuits-candidate.tar.gz" \
            --circuits-configuration insecure-64/minimum --allow-unpinned-archive
          interfold noir setup

      - name: Verify downloaded artifacts
        run: |
          echo "Checking downloaded artifacts:"
          ls -la ~/.cargo/bin/interfold || echo "interfold binary not found"
          ls -la templates/default/target/debug/program-runner || echo "program runner not found"
          ls -la packages/interfold-contracts/dist || echo "SDK dist not found"
          ls -la crates/wasm/dist || echo "WASM dist not found"
          test -f circuits/bin/.active-preset.json || (echo "ERROR: circuit preset stamp not found" && exit 1)
          echo "Program runner permissions:"
          ls -la templates/default/target/debug/program-runner

      - name: Test Template
        run: |
          cd templates/default
          pnpm compile
          pnpm test:integration

  test_interfold_init:
    needs: [detect_changes, build_interfold_cli]
    if: needs.detect_changes.outputs.init == 'true'
    timeout-minutes: 10
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'test_interfold_init') || 'ubuntu-latest' }}
    steps:
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.7.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Download interfold binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interfold-binary
          path: ~/.cargo/bin/
      - name: Make binaries executable
        run: |
          chmod +x ~/.cargo/bin/interfold
      - name: Verify downloaded artifacts
        run: |
          ls -la ~/.cargo/bin/interfold || echo "interfold binary not found"
      - name: Interfold init
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          UPSTREAM_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="$HEAD_REF"
            TEMPLATE_REPO="$HEAD_REPO_URL"
          else
            BRANCH="$REF_NAME"
            TEMPLATE_REPO="$UPSTREAM_REPO_URL"
          fi
          interfold init mycitest --verbose --skip-install --template="${TEMPLATE_REPO}#${BRANCH}:templates/default"

          VERSION=$(interfold --version | awk '{print $2}')
          grep -F "\"@interfold/contracts\": \"$VERSION\"" mycitest/package.json
          grep -F "\"@interfold/sdk\": \"$VERSION\"" mycitest/package.json
          grep -F "\"@interfold/react\": \"$VERSION\"" mycitest/client/package.json
          grep -F "\"@interfold/sdk\": \"$VERSION\"" mycitest/client/package.json
