name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      release_candidate:
        description: Run every CI job for the exact release candidate.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
env:
  SUPPORT_DOCKERFILE_PATH: crates/support/Dockerfile
  CIPHERNODE_DOCKERFILE_PATH: crates/Dockerfile
  SUPPORT_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/e3-support
  CIPHERNODE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ciphernode
  NODE_VERSION: 22
  RUST_TOOLCHAIN: 1.91.1
  NOIR_TOOLCHAIN: v1.0.0-beta.26
  BB_VERSION: 5.2.0
  HARDHAT_VAR_MNEMONIC: 'test test test test test test test test test test test junk'
  HARDHAT_VAR_INFURA_API_KEY: 'zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz'
  PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
  RUST_BACKTRACE: 1
  # Debug and test builds keep only the line tables, which backtraces need, not the full debug
  # information that only a debugger reads. The full information made the root target directory, and
  # every cache restore and save of it, several GB larger. .github/actions/cache-dependencies puts
  # both values in the cache key.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Every ci job rebuilds the workspace crates from scratch after its checkout, so incremental data
  # only costs time: on a 12-thread host that rebuild took 185 s without it and 426 s with it.
  CARGO_INCREMENTAL: 0

# packages: write is granted per-job to the two image builds that can push
# (workflow_dispatch from main); everything else only needs to read the repo.
permissions:
  contents: read

# The migrated jobs use RunsOn only for protected branch events.
# Pull requests keep their previous runner targets, including enclave-ci where configured.
# Each RunsOn label embeds run id, attempt, and job ID so jobs never share runners.
jobs:
  detect_changes:
    timeout-minutes: 5
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'detect_changes') || 'ubuntu-latest' }}
    outputs:
      rust_unit_tests: ${{ steps.jobs.outputs.rust_unit_tests }}
      rust_integration_tests: ${{ steps.jobs.outputs.rust_integration_tests }}
      ciphernode_e2e: ${{ steps.jobs.outputs.ciphernode_e2e }}
      crisp_e2e: ${{ steps.jobs.outputs.crisp_e2e }}
      build_crisp_sdk: ${{ steps.jobs.outputs.build_crisp_sdk }}
      crisp_unit_circuits: ${{ steps.jobs.outputs.crisp_unit_circuits }}
      crisp_unit_rust: ${{ steps.jobs.outputs.crisp_unit_rust }}
      crisp_unit_sdk: ${{ steps.jobs.outputs.crisp_unit_sdk }}
      crisp_unit_contracts: ${{ steps.jobs.outputs.crisp_unit_contracts }}
      templates: ${{ steps.jobs.outputs.templates }}
      zk: ${{ steps.jobs.outputs.zk }}
      contracts: ${{ steps.jobs.outputs.contracts }}
      docker_support: ${{ steps.jobs.outputs.docker_support }}
      docker_ciphernode: ${{ steps.jobs.outputs.docker_ciphernode }}
      net: ${{ steps.jobs.outputs.net }}
      init: ${{ steps.jobs.outputs.init }}
      build_sdk: ${{ steps.jobs.outputs.build_sdk }}
      sdk_tests: ${{ steps.jobs.outputs.sdk_tests }}
      build_e3_support_dev: ${{ steps.jobs.outputs.build_e3_support_dev }}
      openvm_worker: ${{ steps.jobs.outputs.openvm_worker }}
      openvm_guest: ${{ steps.jobs.outputs.openvm_guest }}
      build_circuits: ${{ steps.jobs.outputs.build_circuits }}
      noir_checks: ${{ steps.jobs.outputs.noir_checks }}
      integration_prebuild: ${{ steps.jobs.outputs.integration_prebuild }}
      zk_prover_integration: ${{ steps.jobs.outputs.zk_prover_integration }}
      build_interfold_cli: ${{ steps.jobs.outputs.build_interfold_cli }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ !inputs.release_candidate }}
        id: filter
        with:
          # Required for the '!' exclusions below. The default 'some' quantifier
          # IGNORES negated patterns — worse, a bare '!**/*.md' rule under 'some'
          # matches every non-markdown file, turning every filter always-true.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            # Documentation never changes what a build or test produces, so every
            # filter excludes it. A README edit under crates/ used to run the full
            # rust + contracts + CRISP + docker matrix (~30 minutes).
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              # The OpenVM worker is a workspace of its own, and no cargo build reads the image
              # files. The `openvm_worker` and `docker` filters select their jobs.
              - '!crates/openvm-prover/**'
              - '!crates/Dockerfile'
              - '!crates/support/**'
              - '!**/*.md'
              - '!**/*.mdx'
            # The OpenVM worker is a cargo workspace of its own, built against the OpenVM SDK.
            openvm_worker:
              - 'crates/openvm-prover/**'
              - '!**/*.md'
              - '!**/*.mdx'
            # What the OpenVM guests compile: each project's program and guest, and the crates they
            # link, some of them under guest-only cfg flags.
            openvm_guest:
              - 'Cargo.toml'
              - 'crates/bfv-client/**'
              - 'crates/compute-provider/**'
              - 'crates/fhe-params/**'
              - 'crates/openvm-types/**'
              - 'crates/parity-matrix/**'
              - 'crates/polynomial/**'
              - 'crates/safe/**'
              - 'crates/zk-helpers/**'
              # The programs inherit dependencies from their project workspace, and the native
              # fixture builds in CRISP's.
              - 'examples/CRISP/Cargo.toml'
              - 'examples/CRISP/Cargo.lock'
              - 'examples/CRISP/guest/**'
              - 'examples/CRISP/program/**'
              - 'templates/default/Cargo.toml'
              - 'templates/default/guest/**'
              - 'templates/default/program/**'
              - 'scripts/run-openvm.sh'
              - '!**/*.md'
              - '!**/*.mdx'
            contracts:
              - 'packages/interfold-contracts/**'
              # The manifest is generated from deployed_contracts.json and
              # verified by `gen:manifest:check` in test_contracts. Without this
              # path a hand-edited manifest never runs the drift check and
              # reaches the release assets stale.
              - 'deployments/**'
              # SecureCrispArtifacts.spec.ts reads the CRISP image ID from this directory.
              - 'crates/support/contracts/**'
              - '!**/*.md'
              - '!**/*.mdx'
            # `pnpm check:bindings` in rust_unit_tests runs this script.
            bindings:
              - 'scripts/check-cli-bindings.ts'
            # The `circuits` and `verifiers` filters are in .github/filters/circuits.yml, because
            # .husky/pre-push reads them too. The next step evaluates that file.
            # What the e2e reads: everything in CRISP except the unit test directories
            # (`test/`, singular, holds the Playwright spec and stays in).
            crisp_e2e:
              - 'examples/CRISP/**'
              - '!examples/CRISP/**/tests/**'
              - '!**/*.md'
              - '!**/*.mdx'
            # Each filter below lists the paths that one CRISP layer reads. The CRISP
            # unit jobs use them, so a change runs only the unit tests that it can
            # affect. For example, a server change does not run the SDK or contract tests.
            crisp_rust:
              - 'examples/CRISP/Cargo.toml'
              - 'examples/CRISP/Cargo.lock'
              - 'examples/CRISP/rust-toolchain.toml'
              # Symlinks to members of the CRISP cargo workspace.
              - 'examples/CRISP/.interfold/support/dev'
              - 'examples/CRISP/.interfold/support/openvm'
              - 'examples/CRISP/crates/**'
              - 'examples/CRISP/program/**'
              - 'examples/CRISP/server/**'
              # The server and the program tests embed these files with include_str!.
              - 'examples/CRISP/packages/crisp-contracts/deployed_contracts.json'
              - 'examples/CRISP/packages/crisp-contracts/tests/fixtures/**'
              - '!**/*.md'
              - '!**/*.mdx'
            crisp_circuits:
              - 'examples/CRISP/circuits/**'
              - '!**/*.md'
              - '!**/*.mdx'
            # `pnpm build:sdk` reads these paths: the SDK, the zk-inputs WASM crate and
            # its cargo workspace, and the scripts that compile and stage the circuits.
            # The SDK and contract jobs run the pnpm scripts in package.json.
            crisp_sdk:
              - 'examples/CRISP/package.json'
              - 'examples/CRISP/Cargo.toml'
              - 'examples/CRISP/Cargo.lock'
              - 'examples/CRISP/rust-toolchain.toml'
              - 'examples/CRISP/crates/zk-inputs/**'
              - 'examples/CRISP/crates/zk-inputs-wasm/**'
              - 'examples/CRISP/packages/crisp-sdk/**'
              - 'examples/CRISP/packages/crisp-zk-inputs/**'
              - 'examples/CRISP/scripts/build-presets.mjs'
              - 'examples/CRISP/scripts/check-staged-preset.mjs'
              - 'examples/CRISP/scripts/circuit-sources.mjs'
              - 'examples/CRISP/scripts/compile_circuits.sh'
              - 'examples/CRISP/scripts/stage-preset-artifacts.mjs'
              - '!examples/CRISP/packages/crisp-sdk/tests/**'
              - '!**/*.md'
              - '!**/*.mdx'
            # The contract tests use the built SDK, not the SDK tests, so a change to
            # the SDK tests does not run the contract tests.
            crisp_sdk_tests:
              - 'examples/CRISP/packages/crisp-sdk/tests/**'
              # tests/client-*.test.ts import these client modules.
              - 'examples/CRISP/client/src/utils/circuits.ts'
              - 'examples/CRISP/client/src/utils/directVote.ts'
              - '!**/*.md'
              - '!**/*.mdx'
            crisp_contracts:
              - 'examples/CRISP/packages/crisp-contracts/**'
              - '!**/*.md'
              - '!**/*.mdx'
            templates:
              - 'templates/**'
              - '!**/*.md'
              - '!**/*.mdx'
            sdk:
              - 'packages/interfold-sdk/**'
              - 'packages/interfold-config/**'
              - 'crates/wasm/**'
              - '!**/*.md'
              - '!**/*.mdx'
            # build_sdk builds the React package after the SDK. No other job reads it.
            react:
              - 'packages/interfold-react/**'
              - '!**/*.md'
              - '!**/*.mdx'
            integration_tests:
              - 'tests/integration/**'
              # Run by hand only; no CI job reads them.
              - '!tests/integration/upgrade.sh'
              - '!tests/integration/lib/state_inventory.py'
              - '!**/*.md'
              - '!**/*.mdx'
            # test_net builds crates/net into containers through the net scenario. The crates it
            # links do not trigger it, which keeps it off most Rust PRs.
            net:
              - 'crates/net/**'
              - 'Cargo.lock'
              - 'tests/integration/net.sh'
              - 'tests/integration/test.sh'
              - '!**/*.md'
              - '!**/*.mdx'
            # Both images build from the repository root, so the root .dockerignore decides their
            # context. The ciphernode image runs the entrypoint script.
            docker:
              - 'crates/Dockerfile'
              - 'crates/ciphernode-entrypoint.sh'
              - 'crates/support/Dockerfile'
              - 'crates/support/**'
              - '.dockerignore'
              - '!**/*.md'
              - '!**/*.mdx'
            # Only the workflow, its path filters, and the local actions that it runs. Other
            # workflows, the PR template, and `.github/scripts` do not change what these jobs
            # produce.
            ci:
              - '.github/workflows/ci.yml'
              - '.github/filters/**'
              - '.github/actions/**'
            # Root manifests define the workspace and every `pnpm <script>` a job
            # runs. A change here can retarget or remove a test command, so it
            # must reach every job that installs from the lockfile.
            tooling:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            # Inputs of build_circuits that the `circuits` and `verifiers` filters do not list: the
            # circuit artifact store and its test (`store:circuits`, `test:circuit-tooling`), and
            # the BFV parameters. build-circuits.ts derives the generated constants in
            # ActiveCryptoConfig.sol and utils.ts from them, and hashes their file into SOURCE_HASH.
            # check:verifiers reads none of these files, so they stay out of
            # .github/filters/circuits.yml, which also starts check:verifiers in pre-push.
            circuit_build:
              - 'scripts/circuit-artifacts.ts'
              - 'scripts/circuit-artifacts.test.ts'
              - 'packages/interfold-contracts/scripts/protocol/constants.ts'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ !inputs.release_candidate }}
        id: circuit_filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: .github/filters/circuits.yml
      - name: Compute job filters
        id: jobs
        run: |
          RUST="${{ steps.filter.outputs.rust }}"
          CONTRACTS="${{ steps.filter.outputs.contracts }}"
          BINDINGS="${{ steps.filter.outputs.bindings }}"
          CIRCUITS="${{ steps.circuit_filter.outputs.circuits }}"
          VERIFIERS="${{ steps.circuit_filter.outputs.verifiers }}"
          CIRCUIT_BUILD="${{ steps.filter.outputs.circuit_build }}"
          CRISP_E2E="${{ steps.filter.outputs.crisp_e2e }}"
          CRISP_RUST="${{ steps.filter.outputs.crisp_rust }}"
          CRISP_CIRCUITS="${{ steps.filter.outputs.crisp_circuits }}"
          CRISP_SDK="${{ steps.filter.outputs.crisp_sdk }}"
          CRISP_SDK_TESTS="${{ steps.filter.outputs.crisp_sdk_tests }}"
          CRISP_CONTRACTS="${{ steps.filter.outputs.crisp_contracts }}"
          TEMPLATES="${{ steps.filter.outputs.templates }}"
          SDK="${{ steps.filter.outputs.sdk }}"
          REACT="${{ steps.filter.outputs.react }}"
          INTEGRATION="${{ steps.filter.outputs.integration_tests }}"
          NET="${{ steps.filter.outputs.net }}"
          DOCKER="${{ steps.filter.outputs.docker }}"
          CI="${{ steps.filter.outputs.ci }}"
          TOOLING="${{ steps.filter.outputs.tooling }}"
          OPENVM_WORKER="${{ steps.filter.outputs.openvm_worker }}"
          OPENVM_GUEST="${{ steps.filter.outputs.openvm_guest }}"
          FORCE="${{ github.event_name == 'workflow_dispatch' || inputs.release_candidate }}"

          any() { for v in "$@"; do [ "$v" = "true" ] && echo "true" && return; done; echo "false"; }

          echo "rust_unit_tests=$(any $FORCE $RUST $CONTRACTS $CIRCUITS $BINDINGS $CI $TOOLING)" >> $GITHUB_OUTPUT
          echo "rust_integration_tests=$(any $FORCE $RUST $CONTRACTS $CIRCUITS $CI $TOOLING)" >> $GITHUB_OUTPUT
          echo "ciphernode_e2e=$(any $FORCE $RUST $CONTRACTS $CIRCUITS $INTEGRATION $CI $TOOLING)" >> $GITHUB_OUTPUT
          echo "build_sdk=$(any $FORCE $RUST $CONTRACTS $SDK $REACT $INTEGRATION $CIRCUITS $CI $TEMPLATES $TOOLING)" >> $GITHUB_OUTPUT
          # build_sdk also runs for React, integration, and template changes: it builds React, and
          # the integration and template jobs need its artifacts. Those changes cannot alter the SDK
          # test results, so the tests skip them.
          echo "sdk_tests=$(any $FORCE $RUST $CONTRACTS $SDK $CIRCUITS $CI $TOOLING)" >> $GITHUB_OUTPUT
          # CRISP jobs (unit legs and e2e alike) only guard CRISP's own layers.
          # Cross-cutting ciphernode coverage comes from template_integration,
          # which drives the same full E3 lifecycle with the same interfold
          # binary and circuit preset, minus the CRISP-specific app layers.
          CRISP_E2E_JOB=$(any $FORCE $CRISP_E2E $CI $TOOLING)
          # cargo and nargo do not read the pnpm workspace, so a tooling change
          # does not run the rust and circuit jobs.
          echo "crisp_unit_rust=$(any $FORCE $CRISP_RUST $CI)" >> $GITHUB_OUTPUT
          echo "crisp_unit_circuits=$(any $FORCE $CRISP_CIRCUITS $CI)" >> $GITHUB_OUTPUT
          # The SDK proves with the circuits, and the contract tests use the built SDK.
          CRISP_UNIT_SDK=$(any $FORCE $CRISP_SDK $CRISP_SDK_TESTS $CRISP_CIRCUITS $CI $TOOLING)
          CRISP_UNIT_CONTRACTS=$(any $FORCE $CRISP_CONTRACTS $CRISP_SDK $CRISP_CIRCUITS $CI $TOOLING)
          echo "crisp_e2e=$CRISP_E2E_JOB" >> $GITHUB_OUTPUT
          echo "crisp_unit_sdk=$CRISP_UNIT_SDK" >> $GITHUB_OUTPUT
          echo "crisp_unit_contracts=$CRISP_UNIT_CONTRACTS" >> $GITHUB_OUTPUT
          # build_crisp_sdk feeds crisp_e2e and the SDK and contract jobs, so it runs when any of
          # them runs.
          echo "build_crisp_sdk=$(any $CRISP_E2E_JOB $CRISP_UNIT_SDK $CRISP_UNIT_CONTRACTS)" >> $GITHUB_OUTPUT
          # template_integration is the repo's cross-cutting end-to-end test: it
          # runs a full E3 round against real ciphernodes, so it must run on any
          # change to the stack it drives, not just template changes.
          echo "templates=$(any $FORCE $TEMPLATES $RUST $CONTRACTS $CIRCUITS $SDK $CI $TOOLING)" >> $GITHUB_OUTPUT
          echo "zk=$(any $FORCE $RUST $CIRCUITS $CI $TOOLING)" >> $GITHUB_OUTPUT
          echo "contracts=$(any $FORCE $CONTRACTS $CI $TOOLING)" >> $GITHUB_OUTPUT
          # The OpenVM service compiles repository-local Rust and CRISP program sources.
          echo "docker_support=$(any $FORCE $DOCKER $RUST $CRISP_RUST $CI)" >> $GITHUB_OUTPUT
          # The rust jobs already compile the workspace, so the image build only
          # needs to run when the Dockerfiles or their build context change.
          echo "docker_ciphernode=$(any $FORCE $DOCKER $CI)" >> $GITHUB_OUTPUT
          echo "net=$(any $FORCE $NET $CI)" >> $GITHUB_OUTPUT
          echo "init=$(any $FORCE $TEMPLATES $RUST $CONTRACTS $CI $TOOLING)" >> $GITHUB_OUTPUT
          # Both feed template_integration, so each must cover every path that
          # triggers it — a skipped dependency silently skips the e2e job.
          echo "build_e3_support_dev=$(any $FORCE $TEMPLATES $RUST $CONTRACTS $CIRCUITS $SDK $CI $TOOLING)" >> $GITHUB_OUTPUT
          echo "openvm_worker=$(any $FORCE $OPENVM_WORKER $CI)" >> $GITHUB_OUTPUT
          echo "openvm_guest=$(any $FORCE $OPENVM_GUEST $CI)" >> $GITHUB_OUTPUT
          # build_circuits runs check:verifiers, so every input of the generated verifiers runs it.
          # CIRCUIT_BUILD adds the other files that the job runs or hashes.
          echo "build_circuits=$(any $FORCE $RUST $CIRCUITS $VERIFIERS $CIRCUIT_BUILD $CI $TOOLING)" >> $GITHUB_OUTPUT
          # nargo reads only the circuit paths, so Rust and tooling changes skip the Noir checks.
          echo "noir_checks=$(any $FORCE $CIRCUITS $CI)" >> $GITHUB_OUTPUT
          echo "integration_prebuild=$(any $FORCE $RUST $CONTRACTS $CIRCUITS $INTEGRATION $CI $TOOLING)" >> $GITHUB_OUTPUT
          echo "zk_prover_integration=$(any $FORCE $RUST $CIRCUITS $CI $TOOLING)" >> $GITHUB_OUTPUT
          echo "build_interfold_cli=$(any $FORCE $RUST $CONTRACTS $CIRCUITS $INTEGRATION $TEMPLATES $CRISP_E2E $SDK $CI $TOOLING)" >> $GITHUB_OUTPUT

      - name: Check release promotion safeguards
        run: node --test scripts/release.test.mjs

      - name: Check test runner dispatch and results
        run: node --test scripts/test-harnesses.test.mjs

  test_dappnode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Test DAppNode credentials and health checks
        run: |
          timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y gettext-base
          bash dappnode/tests/test-hardening.sh
      - name: Test the ciphernode image state location
        run: bash crates/tests/docker/test-ciphernode-entrypoint.sh

  rust_unit_tests:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.rust_unit_tests == 'true'
    # Without a Rust cache, a leg can need close to 20 minutes before the cache save. The doc leg
    # also runs the guard tests and the CLI tests.
    timeout-minutes: 30
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}-{3}{4}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'rust_unit_tests', matrix.suite, matrix.partition) || 'ubuntu-latest' }}
    # Library tests link cfg(test) builds. Doc-tests and the separate test targets link the plain
    # libraries, so they run together in the `doc` leg. The legs share no compiled crates, and each
    # leg builds its kind once.
    #
    # Running the 1,900 library tests took about 8 minutes after about 5 minutes of compiling, so two
    # `lib` legs each build the tests and run half of them. The checks that read the whole tree run in
    # the first one.
    strategy:
      matrix:
        include:
          - suite: lib
            partition: 1
          - suite: lib
            partition: 2
          - suite: doc
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Keeps the token out of .git/config, where install and build scripts could read it and use
          # this job's actions: write. The cancel step gets the token on its own.
          persist-credentials: false

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Install solc
        uses: ./.github/actions/install-solc

      - name: pnpm-setup
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

        # We need to setup node in order to compile the hardhat contracts to get the artifacts
      - name: 'Setup node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 'Install the dependencies'
        run: 'pnpm install --frozen-lockfile'

      - name: Checking code format rust
        if: matrix.suite == 'lib' && matrix.partition == 1
        run: pnpm rust:lint

      # The Agent Harness workflow runs the same script on every pull request.
      - name: Check repository invariants
        if: matrix.suite == 'lib' && matrix.partition == 1 && github.event_name != 'pull_request'
        run: pnpm check:invariants

      - name: Compile contracts for ABI catalog tests
        run: pnpm evm:build

      - name: Check the committed contract artifacts against the build
        if: matrix.suite == 'lib' && matrix.partition == 1
        run: pnpm check:bindings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest

      # nextest runs the test binaries in parallel. `cargo test` runs them one after another, so
      # the step took the sum of every crate's tests rather than the slowest crate's.
      - name: Run library tests
        if: matrix.suite == 'lib'
        run: cargo nextest run --lib --partition hash:${{ matrix.partition }}/2

      - name: Run doc-tests
        if: matrix.suite == 'doc'
        run: cargo test --doc

      # The library run skips the entrypoint integration tests, the CLI binary tests, and the CLI
      # secret-input integration tests.
      - name: Run the entrypoint guard and older-schema tests and the CLI tests
        if: matrix.suite == 'doc'
        run:
          cargo nextest run -p e3-entrypoint --test reset_data_guard --test purge_guard --test validate_older_schema --test
          validate_snapshot_errors -p e3-cli --bins --test cli_secrets

      # `parallel` is off by default, so the library tests compile the sequential fallback of
      # `recompute_commitments` and the rayon body of that function ships untested. This step is
      # what exercises it. Scoped with `-p` rather than `--all-features`: the feature is the one
      # thing this crate needs enabled, and the OpenVM guest is unaffected either way because it
      # builds this crate without the feature.
      - name: Run compute-provider Unit Tests with parallel batching
        if: matrix.suite == 'doc'
        run: 'cargo test -p e3-compute-provider --features parallel'

      - name: Run Rust-to-Solidity slashing assertions
        if: matrix.suite == 'doc'
        run: pnpm rust:test:slashing

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  rust_integration_tests:
    needs: [detect_changes, integration_prebuild]
    if: needs.detect_changes.outputs.rust_integration_tests == 'true'
    timeout-minutes: 45
    runs-on:
      group: enclave-ci
      labels: [enclave-ci-runner]
    # Each full-proof `test_trbfv_actor` run takes about nine minutes, so the runs are parallel
    # legs. The `integration` leg runs the other integration targets in skip-aggregation mode;
    # the CLI e2e jobs already drive a full E3 in that mode.
    strategy:
      matrix:
        leg: [integration, offline-party, standby-node]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Install solc
        uses: ./.github/actions/install-solc

      - name: pnpm-setup
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: 'Setup node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 'Install the dependencies'
        run: 'pnpm install --frozen-lockfile'

      - name: Download source-aligned ZK fixtures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: integration-noir-artifacts
          path: .ci-noir/

      - name: Stage source-aligned circuit fixtures
        run: |
          chmod +x .ci-noir/bin/bb
          test -f .ci-noir/circuits/insecure-512/minimum/default/recursive_aggregation/c2ab_fold/c2ab_fold.json
          mkdir -p dist/circuits/insecure-512
          cp -R .ci-noir/circuits/insecure-512/minimum dist/circuits/insecure-512/

      # A separate test target, so no other step runs it. It fails when a persisted or gossiped
      # layout differs from its fixture. The in-crate locks run with the library tests. Without
      # `-p`, cargo resolves features as in the next step, so both steps share one build.
      - name: Run the persisted layout lock
        if: matrix.leg == 'integration'
        run: 'cargo test --test layout_lock'

      - name: Run Integration Tests
        if: matrix.leg == 'integration'
        env:
          CIPHERNODE_SKIP_PROOF_AGGREGATION: 'true'
          E3_CUSTOM_BB: ${{ github.workspace }}/.ci-noir/bin/bb
        run: 'cargo test --test integration -- --nocapture --skip test_trbfv_actor'

      - name: Run offline DKG integration test with full proofs
        if: matrix.leg == 'offline-party'
        timeout-minutes: 20
        env:
          BENCHMARK_MODE: insecure
          BENCHMARK_OFFLINE_AFTER_C0_PARTY_ID: '1'
          BENCHMARK_DKG_WINDOW_SECS: '1200'
          E3_ENCRYPTION_KEY_COLLECTION_TIMEOUT_SECS: '60'
          E3_THRESHOLD_SHARE_COLLECTION_TIMEOUT_SECS: '180'
          E3_CUSTOM_BB: ${{ github.workspace }}/.ci-noir/bin/bb
        run: 'cargo test -p e3-tests --test integration test_trbfv_actor -- --exact --nocapture'

      - name: Run full-proof DKG integration with standby node
        if: matrix.leg == 'standby-node'
        timeout-minutes: 20
        env:
          BENCHMARK_MODE: insecure
          BENCHMARK_DKG_WINDOW_SECS: '1200'
          E3_ENCRYPTION_KEY_COLLECTION_TIMEOUT_SECS: '60'
          E3_THRESHOLD_SHARE_COLLECTION_TIMEOUT_SECS: '120'
          E3_CUSTOM_BB: ${{ github.workspace }}/.ci-noir/bin/bb
        run: 'cargo test -p e3-tests --test integration test_trbfv_actor -- --exact --nocapture'

  zk_prover_integration:
    needs: [detect_changes, integration_prebuild]
    if: needs.detect_changes.outputs.zk_prover_integration == 'true'
    timeout-minutes: 60
    runs-on:
      group: enclave-ci
      labels: [enclave-ci-runner]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-dependencies

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install solc
        uses: ./.github/actions/install-solc

      - name: pnpm-setup
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: 'Setup node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 'Install the dependencies'
        run: 'pnpm install --frozen-lockfile'

      - name: Download source-aligned ZK fixtures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: integration-noir-artifacts
          path: .ci-noir/

      - name: Prepare source-aligned circuit archive
        run: |
          test -f .ci-noir/circuits/insecure-512/minimum/default/dkg/pk/pk.json
          test -f .ci-noir/circuits/secure-8192/minimum/default/dkg/pk/pk.json
          pnpm tsx scripts/circuit-artifacts.ts checksums --dir .ci-noir/circuits
          mkdir -p "$RUNNER_TEMP/circuit-release"
          tar -czf "$RUNNER_TEMP/circuit-release/circuits-candidate.tar.gz" \
            -C .ci-noir circuits

      - name: Cache Barretenberg binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bb
          key: bb-${{ env.BB_VERSION }}-${{ runner.arch }}

      - name: Run ZK prover integration tests
        env:
          E3_TEST_CIRCUITS_DOWNLOAD_URL: http://127.0.0.1:8123/circuits-candidate.tar.gz
        run: |
          export E3_TEST_CIRCUITS_SHA256=$(sha256sum "$RUNNER_TEMP/circuit-release/circuits-candidate.tar.gz" | cut -d ' ' -f1)
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$RUNNER_TEMP/circuit-release" >"$RUNNER_TEMP/circuit-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          curl --fail --silent --head --retry 10 --retry-connrefused --retry-delay 1 "$E3_TEST_CIRCUITS_DOWNLOAD_URL" >/dev/null
          cargo test -p e3-zk-prover --features integration-tests --test integration_tests -- --nocapture

  # Build the native OpenVM HTTP service. Proving artifacts are deployment-specific.
  build_e3_support_openvm:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.docker_support == 'true'
    timeout-minutes: 30
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16/spot=false', github.run_id,
      github.run_attempt, 'build_e3_support_openvm') || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Generate tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short=9 HEAD)
          TAGS="${SUPPORT_IMAGE_NAME}:${SHORT_SHA}"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="$TAGS,${SUPPORT_IMAGE_NAME}:main"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "image=${SUPPORT_IMAGE_NAME}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Loaded for the smoke test, which runs before the image is published.
      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ env.SUPPORT_DOCKERFILE_PATH }}
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: |
            type=gha,scope=e3-support
          # Pull requests read the layer cache and do not write it. Exporting the whole graph
          # (`mode=max`) took 13 of the ciphernode job's 27 minutes, and a pull request's cache is
          # readable only by reruns of that pull request.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=e3-support' || '' }}

      # Starts the service with a stub worker that passes its configuration check, then asks for its
      # health: the image's command and environment, the worker launch and the HTTP server.
      - name: Smoke-test the image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          fixtures="${RUNNER_TEMP}/openvm-smoke"
          mkdir -p "$fixtures"
          printf '#!/bin/sh\nexit 0\n' > "$fixtures/worker"
          echo '{}' > "$fixtures/worker.json"
          chmod 755 "$fixtures" "$fixtures/worker"
          chmod 644 "$fixtures/worker.json"
          docker run -d --name openvm-smoke -p 127.0.0.1:13151:13151 -v "${fixtures}:/fixtures:ro" \
            -e OPENVM_PROVER_BIN=/fixtures/worker -e OPENVM_PROVER_CONFIG=/fixtures/worker.json "$IMAGE"
          deadline=$((SECONDS + 60))
          until curl -sf --max-time 5 http://127.0.0.1:13151/health; do
            if (( SECONDS >= deadline )) || [ "$(docker inspect -f '{{.State.Running}}' openvm-smoke)" != true ]; then
              docker logs openvm-smoke
              docker rm -f openvm-smoke > /dev/null
              echo "The service did not answer its health check within 60 seconds" >&2
              exit 1
            fi
            sleep 1
          done
          echo
          docker rm -f openvm-smoke > /dev/null

      # The builder still holds every layer of the build above, so this only uploads it.
      - name: Push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ env.SUPPORT_DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: |
            type=gha,scope=e3-support

  build_ciphernode_image:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.docker_ciphernode == 'true'
    timeout-minutes: 60
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16/spot=false', github.run_id,
      github.run_attempt, 'build_ciphernode_image') || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Generate tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short=9 HEAD)
          TAGS="${CIPHERNODE_IMAGE_NAME}:${SHORT_SHA}"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="$TAGS,${CIPHERNODE_IMAGE_NAME}:main"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "image=${CIPHERNODE_IMAGE_NAME}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Loaded for the smoke test, which runs before the image is published.
      - name: Build ciphernode image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ env.CIPHERNODE_DOCKERFILE_PATH }}
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: |
            type=gha,scope=ciphernode
          # Pull requests read the layer cache and do not write it. Exporting the whole graph
          # (`mode=max`) took 13 of the ciphernode job's 27 minutes, and a pull request's cache is
          # readable only by reruns of that pull request.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=ciphernode' || '' }}

      # The entrypoint reads the config file and resolves the node's state paths with the binary
      # before it runs the command. An empty config file is a valid config.
      - name: Smoke-test the ciphernode image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          config="${RUNNER_TEMP}/ciphernode-config.yaml"
          : > "$config"
          chmod 644 "$config"
          status=0
          output=$(timeout 60 docker run --rm -v "${config}:/home/ciphernode/.config/interfold/config.yaml:ro" "$IMAGE" --version 2>&1) ||
            status=$?
          echo "$output"
          [ "$status" -eq 0 ]
          grep -Eq '^interfold [0-9]+\.[0-9]+\.[0-9]+' <<<"$output"

      # The builder still holds every layer of the build above, so this only uploads it.
      - name: Push ciphernode image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ env.CIPHERNODE_DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: |
            type=gha,scope=ciphernode

  test_contracts:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.contracts == 'true'
    timeout-minutes: 15
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
      'test_contracts') || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: 'Check out the repo'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6
        with:
          # Keeps the token out of .git/config, where install and build scripts could read it and use
          # this job's actions: write. The cancel step gets the token on its own.
          persist-credentials: false

      - name: pnpm-setup
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: 'Setup node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 'Install the dependencies'
        run: 'pnpm install --frozen-lockfile'

      - name: 'Lint the code'
        run: 'pnpm evm:lint'

      - name: 'Add lint summary'
        run: |
          echo "## Lint results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

      - name: 'Enforce production contract size budget'
        run: 'pnpm --filter @interfold/contracts size:check'

      - name: 'Validate upgrade storage layouts'
        run: 'pnpm --filter @interfold/contracts validate:upgrade'

      # The manifest is what operators fetch to detect a redeploy, so it must
      # never lag deployed_contracts.json.
      - name: 'Check the deployment manifest is up to date'
        run: 'pnpm --filter @interfold/contracts gen:manifest:check'

      # Without coverage instrumentation. No step reads the coverage report, instrumentation makes
      # the suite several times slower, and under `--coverage` BfvVkBindingIntegration skips the
      # on-chain Honk verification because instrumented verifiers run out of gas.
      - name: 'Test the contracts'
        run: 'pnpm evm:test'

      - name: 'Add test summary'
        run: |
          echo "## Test results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  test_net:
    needs: [detect_changes]
    if: needs.detect_changes.outputs.net == 'true'
    timeout-minutes: 15
    runs-on:
      ${{ github.repository == 'theinterfold/interfold' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev') && format('runs-on={0}-{1}-{2}/runner=4cpu-linux-x64/ram=16', github.run_id, github.run_attempt,
