name: Release

permissions:
  id-token: write
  contents: write
  packages: write

concurrency:
  group: release-promotion-${{ github.repository }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*' # Pre-release tags like v1.0.0-beta.1

env:
  CIPHERNODE_DOCKERFILE_PATH: crates/Dockerfile
  SUPPORT_DOCKERFILE_PATH: crates/support/Dockerfile
  CIPHERNODE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ciphernode
  SUPPORT_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/e3-support
  NPM_VERSION: '11.19.1'
  NOIR_TOOLCHAIN: v1.0.0-beta.26
  MNEMONIC: 'test test test test test test test test test test test junk'
  INFURA_API_KEY: 'zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz'
  ETHERSCAN_API_KEY: 'zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz'

jobs:
  validate-and-prepare:
    name: Validate Tag and Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release candidate
        id: release
        run: node scripts/release.mjs prepare

  build-ciphernode-image-release:
    name: Build & Push ciphernode (release)
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, release-candidate-gate]
    env:
      CIPHERNODE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ciphernode
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ciphernode release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: crates/Dockerfile
          push: true
          tags: |
            ${{ env.CIPHERNODE_IMAGE_NAME }}:${{ needs.validate-and-prepare.outputs.version }}
          cache-from: |
            type=gha,scope=ciphernode
          cache-to: |
            type=gha,mode=max,scope=ciphernode

  build-e3-support-release:
    name: Build & Push e3-support (release)
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, release-candidate-gate]
    env:
      SUPPORT_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/e3-support
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the CLI revision tag
        id: revision
        run: echo "short_sha=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & push e3-support release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.SUPPORT_DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ env.SUPPORT_IMAGE_NAME }}:${{ needs.validate-and-prepare.outputs.version }}
            ${{ env.SUPPORT_IMAGE_NAME }}:${{ steps.revision.outputs.short_sha }}
          cache-from: |
            type=gha,scope=e3-support
          cache-to: |
            type=gha,mode=max,scope=e3-support

  build-dappnode-package-release:
    name: Build DAppNode package (release)
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, build-ciphernode-image-release]
    if: needs.validate-and-prepare.outputs.is_prerelease == 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dappnode/package-lock.json

      - name: Install DAppNode SDK
        working-directory: dappnode
        run: npm ci --ignore-scripts

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build DAppNode package
        working-directory: dappnode
        run: npx --no-install dappnodesdk build --skip_upload --skip_save --arch linux/amd64

  build-binaries:
    name: Build Binaries (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: validate-and-prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install solc (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/install-solc

      - name: Install solc (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install solidity

      - name: Build interfold binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin interfold

      - name: Build interfoldup binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin interfoldup

      - name: Create release archives
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/interfold-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz" interfold
          tar -C "target/${{ matrix.target }}/release" -czf "dist/interfoldup-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz" interfoldup

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interfold-binaries-${{ matrix.os_name }}-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/

  publish-npm-packages:
    name: Publish NPM Packages
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, release-candidate-gate]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # `pnpm build:ts` builds the SDK, whose prebuild compiles the threshold
      # circuits via `nargo` (packages/interfold-sdk/scripts/compile-circuits.sh).
      # Without nargo on PATH the build fails with "nargo is not installed".
      - name: Install Nargo
        uses: noir-lang/noirup@v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:ts

      - name: Prepare packages for npm publishing
        run: pnpm prepare-publish

      - name: Publish @interfold/config
        run: node scripts/release.mjs publish-npm packages/interfold-config ${{ needs.validate-and-prepare.outputs.npm_tag }}

      - name: Publish @interfold/contracts
        run: node scripts/release.mjs publish-npm packages/interfold-contracts ${{ needs.validate-and-prepare.outputs.npm_tag }}

      - name: Publish @interfold/wasm
        run: node scripts/release.mjs publish-npm crates/wasm ${{ needs.validate-and-prepare.outputs.npm_tag }}

      - name: Publish @interfold/sdk
        run: node scripts/release.mjs publish-npm packages/interfold-sdk ${{ needs.validate-and-prepare.outputs.npm_tag }}

      - name: Publish @interfold/react
        run: node scripts/release.mjs publish-npm packages/interfold-react ${{ needs.validate-and-prepare.outputs.npm_tag }}

      - name: Publish @interfold/mcp
        run: node scripts/release.mjs publish-npm packages/interfold-mcp ${{ needs.validate-and-prepare.outputs.npm_tag }}

  download-circuits:
    name: Download Circuit Artifacts
    runs-on: ubuntu-latest
    needs: validate-and-prepare
    outputs:
      source_hash: ${{ steps.pull.outputs.source_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Pull circuit artifacts
        id: pull
        run: |
          SOURCE_HASH=$(pnpm tsx scripts/build-circuits.ts hash)
          echo "source_hash=$SOURCE_HASH" >> "$GITHUB_OUTPUT"

          if ! git fetch origin circuit-artifacts; then
            echo "::error::Required circuit-artifacts branch is missing."
            exit 1
          fi
          mkdir -p dist/circuits
          git archive --format=tar --output="$RUNNER_TEMP/circuit-artifacts.tar" origin/circuit-artifacts
          tar -xf "$RUNNER_TEMP/circuit-artifacts.tar" -C dist/circuits

      - name: Verify circuit artifacts match source
        # This check requires exactly one source-bound build stamp for each of the six supported
        # preset/committee pairs before the archive can be created.
        run: pnpm store:circuits verify-release --source-hash "${{ steps.pull.outputs.source_hash }}"

      - name: Create release archive
        working-directory: dist
        run: tar -czvf circuits-${{ needs.validate-and-prepare.outputs.version }}.tar.gz circuits/

      - uses: actions/upload-artifact@v4
        with:
          name: noir-circuits
          if-no-files-found: error
          path: |
            dist/circuits-*.tar.gz
            dist/circuits/SHA256SUMS
            dist/circuits/checksums.json

  release-candidate-gate:
    name: Approve Release Artifacts
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, build-binaries, download-circuits]
    steps:
      - name: Confirm candidate qualification
        run: echo "Candidate ${{ needs.validate-and-prepare.outputs.candidate_sha }} is on main and passed release artifact checks."

  publication-gate:
    name: Verify Every Release Publication
    runs-on: ubuntu-latest
    needs:
      [validate-and-prepare, build-ciphernode-image-release, build-e3-support-release, publish-npm-packages, build-dappnode-package-release]
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@v6

      - name: Require all publications
        env:
          IS_PRERELEASE: ${{ needs.validate-and-prepare.outputs.is_prerelease }}
          CIPHERNODE_RESULT: ${{ needs.build-ciphernode-image-release.result }}
          SUPPORT_RESULT: ${{ needs.build-e3-support-release.result }}
          NPM_RESULT: ${{ needs.publish-npm-packages.result }}
          DAPPNODE_RESULT: ${{ needs.build-dappnode-package-release.result }}
        run: node scripts/release.mjs verify-publications

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, build-binaries, download-circuits, publication-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The stable-tag step uses a temporary credential helper.
          persist-credentials: false

      - name: Download candidate binaries
        uses: actions/download-artifact@v4
        with:
          pattern: interfold-binaries-*
          merge-multiple: true
          path: dist/binaries

      - name: Download candidate circuits
        uses: actions/download-artifact@v4
        with:
          name: noir-circuits
          path: dist/circuits

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The compute-provider provenance manifest is NOT generated here: it can only be complete on
      # a machine that built the guest (Elf.sol + builder image digest) with a deployed ciphertext
      # verifier to read (--rpc/--verifier), none of which this job has. It is produced manually per
      # docs/pages/verifying-the-compute-provider.mdx until the guest-build job can attach it.

      - name: Prepare release assets and notes
        env:
          RELEASE_VERSION: ${{ needs.validate-and-prepare.outputs.version }}
          RELEASE_IS_PRERELEASE: ${{ needs.validate-and-prepare.outputs.is_prerelease }}
          RELEASE_CANDIDATE_SHA: ${{ needs.validate-and-prepare.outputs.candidate_sha }}
          CIRCUIT_SOURCE_HASH: ${{ needs.download-circuits.outputs.source_hash }}
        run: node scripts/release.mjs prepare-assets

      - name: Set up Buildx for stable aliases
        if: needs.validate-and-prepare.outputs.is_prerelease == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.validate-and-prepare.outputs.is_prerelease == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote stable container aliases
        if: needs.validate-and-prepare.outputs.is_prerelease == 'false'
        run: |
          VERSION="${{ needs.validate-and-prepare.outputs.version }}"
          docker buildx imagetools create \
            --tag "${CIPHERNODE_IMAGE_NAME}:latest" \
            "${CIPHERNODE_IMAGE_NAME}:${VERSION}"
          docker buildx imagetools create \
            --tag "${SUPPORT_IMAGE_NAME}:latest" \
            "${SUPPORT_IMAGE_NAME}:${VERSION}"

      - name: Update stable tag (for stable releases only)
        if: needs.validate-and-prepare.outputs.is_prerelease == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs promote-stable ${{ needs.validate-and-prepare.outputs.candidate_sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-and-prepare.outputs.version }}
          name: v${{ needs.validate-and-prepare.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.validate-and-prepare.outputs.is_prerelease }}
          generate_release_notes: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
