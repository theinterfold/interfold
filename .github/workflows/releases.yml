name: Release

permissions:
  id-token: write
  contents: write
  packages: write

concurrency:
  group: release-promotion-${{ github.repository }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*' # Pre-release tags like v1.0.0-beta.1

env:
  CIPHERNODE_DOCKERFILE_PATH: crates/Dockerfile
  CIPHERNODE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ciphernode
  NPM_VERSION: '11.19.1'
  NOIR_TOOLCHAIN: v1.0.0-beta.26
  MNEMONIC: 'test test test test test test test test test test test junk'
  INFURA_API_KEY: 'zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz'
  ETHERSCAN_API_KEY: 'zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz'

jobs:
  validate-and-prepare:
    name: Validate Tag and Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      channel: ${{ steps.release.outputs.channel }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release candidate
        id: release
        run: node scripts/release/index.mjs prepare

  build-ciphernode-image-release:
    name: Build & Push ciphernode (release)
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, release-candidate-gate, download-circuits]
    env:
      CIPHERNODE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ciphernode
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ciphernode release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: crates/Dockerfile
          build-args: |
            E3_CIRCUITS_ARCHIVE_SHA256=${{ needs.download-circuits.outputs.archive_sha256 }}
          push: true
          tags: |
            ${{ env.CIPHERNODE_IMAGE_NAME }}:${{ needs.validate-and-prepare.outputs.version }}
          # Read-only: a cache written from a tag is scoped to that tag and no later run can
          # restore it. Each release saved about 2.5 GB that only counted against the quota.
          cache-from: |
            type=gha,scope=ciphernode

  build-dappnode-package-release:
    name: Build DAppNode packages (release)
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, build-ciphernode-image-release]
    if: needs.validate-and-prepare.outputs.is_prerelease == 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dappnode/package-lock.json

      - name: Install DAppNode SDK
        working-directory: dappnode
        run: npm ci --ignore-scripts

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build DAppNode packages
        run: npm run build --prefix dappnode -- --skip_upload --skip_save

  build-binaries:
    name: Build Binaries (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    needs: [validate-and-prepare, download-circuits]
    env:
      E3_CIRCUITS_ARCHIVE_SHA256: ${{ needs.download-circuits.outputs.archive_sha256 }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: interfold-linux-x86_64
            features: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: interfold-macos-aarch64
            features: ''
          # Test and CI only: projects such as CRISP run their end-to-end tests with this binary and
          # `skip_proof_aggregation: true`. The install script and `interfold update` select
          # `interfold-<platform>.tar.gz`, so they never install it.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: interfold-test-only-skip-proof-aggregation-linux-x86_64
            features: test-only-skip-proof-aggregation

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset }}

      - name: Install solc (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/install-solc

      - name: Install solc (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install solidity

      - name: Build interfold binary
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          test -n "$E3_CIRCUITS_ARCHIVE_SHA256"
          cargo build --locked --release --target ${{ matrix.target }} --bin interfold ${FEATURES:+--features "$FEATURES"}

      - name: Check compiled circuit archive pin
        run: |
          target/${{ matrix.target }}/release/interfold noir status > "$RUNNER_TEMP/noir-status.txt"
          grep -Fx "  Archive SHA-256: $E3_CIRCUITS_ARCHIVE_SHA256" "$RUNNER_TEMP/noir-status.txt"

      # A production archive must report no features. The test-only archive must report exactly its
      # feature, and its name must say that it is test-only.
      - name: Check compiled features
        env:
          ASSET: ${{ matrix.asset }}
          FEATURES: ${{ matrix.features }}
        run: |
          compiled="$(target/${{ matrix.target }}/release/interfold rev --features)"
          test "$compiled" = "$FEATURES"
          if [ -n "$FEATURES" ]; then
            case "$ASSET" in interfold-test-only-*) ;; *) exit 1 ;; esac
          fi

      - name: Create release archives
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.asset }}.tar.gz" interfold

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interfold-binaries-${{ matrix.asset }}
          if-no-files-found: error
          path: dist/

  publish-npm-packages:
    name: Publish NPM Packages
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, release-candidate-gate]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # `pnpm build:ts` builds the SDK, whose prebuild compiles the threshold
      # circuits via `nargo` (packages/interfold-sdk/scripts/compile-circuits.sh).
      # Without nargo on PATH the build fails with "nargo is not installed".
      - name: Install Nargo
        uses: noir-lang/noirup@v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:ts

      - name: Prepare packages for npm publishing
        run: pnpm prepare-publish

      - name: Publish @interfold/config
        run: node scripts/release/index.mjs publish-npm packages/interfold-config ${{ needs.validate-and-prepare.outputs.channel }}

      - name: Publish @interfold/contracts
        run: node scripts/release/index.mjs publish-npm packages/interfold-contracts ${{ needs.validate-and-prepare.outputs.channel }}

      - name: Publish @interfold/wasm
        run: node scripts/release/index.mjs publish-npm crates/wasm ${{ needs.validate-and-prepare.outputs.channel }}

      - name: Publish @interfold/sdk
        run: node scripts/release/index.mjs publish-npm packages/interfold-sdk ${{ needs.validate-and-prepare.outputs.channel }}

      - name: Publish @interfold/react
        run: node scripts/release/index.mjs publish-npm packages/interfold-react ${{ needs.validate-and-prepare.outputs.channel }}

      - name: Publish @interfold/mcp
        run: node scripts/release/index.mjs publish-npm packages/interfold-mcp ${{ needs.validate-and-prepare.outputs.channel }}

  download-circuits:
    name: Download Circuit Artifacts
    runs-on: ubuntu-latest
    needs: validate-and-prepare
    outputs:
      source_hash: ${{ steps.pull.outputs.source_hash }}
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      # The newest circuit-artifacts revision whose SOURCE_HASH is this tree's, not the branch tip,
      # which can hold a build of another tree. The hash covers the sources and the toolchain pins.
      - name: Pull circuit artifacts
        id: pull
        run: |
          SOURCE_HASH=$(pnpm --silent build:circuits hash)
          echo "source_hash=$SOURCE_HASH" >> "$GITHUB_OUTPUT"

          if ! git fetch origin circuit-artifacts; then
            echo "::error::Required circuit-artifacts branch is missing."
            exit 1
          fi
          pnpm store:circuits pull

      - name: Verify circuit artifacts match source
        # This check requires exactly one source-bound build stamp for each of the six supported
        # preset/committee pairs before the archive can be created.
        run: pnpm store:circuits verify-release --source-hash "${{ steps.pull.outputs.source_hash }}"

      - name: Create release archive
        id: archive
        working-directory: dist
        env:
          VERSION: ${{ needs.validate-and-prepare.outputs.version }}
        run: |
          tar -czvf "circuits-${VERSION}.tar.gz" circuits/
          echo "sha256=$(sha256sum "circuits-${VERSION}.tar.gz" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: noir-circuits
          if-no-files-found: error
          path: |
            dist/circuits-*.tar.gz
            dist/circuits/SHA256SUMS
            dist/circuits/checksums.json

  release-candidate-gate:
    name: Approve Release Artifacts
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, build-binaries, download-circuits]
    steps:
      - name: Confirm candidate qualification
        run: echo "Candidate ${{ needs.validate-and-prepare.outputs.candidate_sha }} is on main and passed release artifact checks."

  publication-gate:
    name: Verify Every Release Publication
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, build-ciphernode-image-release, publish-npm-packages, build-dappnode-package-release]
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@v6

      - name: Require all publications
        env:
          IS_PRERELEASE: ${{ needs.validate-and-prepare.outputs.is_prerelease }}
          CIPHERNODE_RESULT: ${{ needs.build-ciphernode-image-release.result }}
          NPM_RESULT: ${{ needs.publish-npm-packages.result }}
          DAPPNODE_RESULT: ${{ needs.build-dappnode-package-release.result }}
        run: node scripts/release/index.mjs verify-publications

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, build-binaries, download-circuits, publication-gate]
    # The DAppNode job is skipped for a pre-release. The implicit success() check fails on that skip.
    # failure() still stops this job when any earlier job fails.
    if: >-
      ${{ !cancelled() && !failure() && needs.build-binaries.result == 'success' && needs.download-circuits.result == 'success' &&
      needs.publication-gate.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The stable-tag step uses a temporary credential helper.
          persist-credentials: false

      - name: Download candidate binaries
        uses: actions/download-artifact@v4
        with:
          pattern: interfold-binaries-*
          merge-multiple: true
          path: dist/binaries

      - name: Download candidate circuits
        uses: actions/download-artifact@v4
        with:
          name: noir-circuits
          path: dist/circuits

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The compute-provider provenance manifest is NOT generated here: it can only be complete on
      # a machine that built the OpenVM guest and its keys and can check a deployed receipt verifier
      # (--rpc/--verifier), none of which this job has. It is produced manually per
      # docs/pages/build/e3-program/verify-compute-provider.mdx until a guest-build job can attach it.

      - name: Prepare release assets and notes
        env:
          RELEASE_VERSION: ${{ needs.validate-and-prepare.outputs.version }}
          RELEASE_IS_PRERELEASE: ${{ needs.validate-and-prepare.outputs.is_prerelease }}
          RELEASE_CANDIDATE_SHA: ${{ needs.validate-and-prepare.outputs.candidate_sha }}
          CIRCUIT_SOURCE_HASH: ${{ needs.download-circuits.outputs.source_hash }}
        run: node scripts/release/index.mjs prepare-assets

      - name: Set up Buildx for channel aliases
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every release moves the `dev` aliases, so `dev` is the most recently published release. A
      # stable release also moves the `latest` aliases.
      - name: Promote channel container aliases
        env:
          CHANNEL: ${{ needs.validate-and-prepare.outputs.channel }}
          VERSION: ${{ needs.validate-and-prepare.outputs.version }}
        run: |
          aliases=(--tag "${CIPHERNODE_IMAGE_NAME}:dev")
          if [ "${CHANNEL}" = latest ]; then
            aliases+=(--tag "${CIPHERNODE_IMAGE_NAME}:latest")
          fi
          docker buildx imagetools create "${aliases[@]}" "${CIPHERNODE_IMAGE_NAME}:${VERSION}"

      - name: Update stable tag (for stable releases only)
        if: needs.validate-and-prepare.outputs.is_prerelease == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/index.mjs promote-stable ${{ needs.validate-and-prepare.outputs.candidate_sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-and-prepare.outputs.version }}
          name: v${{ needs.validate-and-prepare.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.validate-and-prepare.outputs.is_prerelease }}
          generate_release_notes: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
