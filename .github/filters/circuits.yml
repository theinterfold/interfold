# Path filters for the circuit jobs, in the dorny/paths-filter format. The `detect_changes` job in
# `workflows/ci.yml` reads this file. `.husky/pre-push` reads every pattern in it as one list, and
# runs `check:verifiers` when a pushed branch changes a matching path.
#
# Put one single-quoted pattern on each list line, because the hook reads the patterns with sed.
# Give every filter the same `!` patterns, because the hook applies each one to the whole list.

# The Noir circuits and the scripts that build, lint, and test them.
# Add new generator/check inputs explicitly; scripts/circuits/ is not matched wholesale.
circuits:
  - 'circuits/**'
  - 'scripts/circuits/lint.sh'
  - 'scripts/circuits/test.sh'
  - 'scripts/circuits/verifiers*.ts'
  - 'scripts/circuits/constants.ts'
  - 'scripts/circuits/build-pairs.json'
  - 'crates/zk/build/**'
  - 'crates/zk/prover/supported-configurations.json'
  - '!**/*.md'
  - '!**/*.mdx'

# Configuration/consumer inputs outside the Noir compiler.
crypto_config:
  - 'scripts/circuits/**'
  - 'scripts/checks/committee.sh'
  - 'scripts/hooks/**'
  - '.husky/pre-push'
  - '.github/filters/circuits.yml'
  - '.github/workflows/ci.yml'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'package.json'
  - 'crates/fhe/**'
  - 'crates/parity-matrix/**'
  - 'crates/safe/**'
  - 'packages/interfold-contracts/**'
  - 'packages/interfold-sdk/**'
  - 'packages/interfold-dashboard/**'
  - 'templates/**'
  - '!**/*.md'
  - '!**/*.mdx'

# Other inputs of the generated verifier contracts.
verifiers:
  - 'packages/interfold-contracts/contracts/verifiers/**'
  - 'crates/zk/prover/versions.json'
  - 'crates/zk/config/**'
  - 'crates/zk/witness/**'
  - 'crates/fhe-params/**'
  - 'crates/committee/**'
  - 'crates/polynomial/**'
  # scripts/circuits/verifiers.ts formats contracts with this config and the prettier
  # and prettier-plugin-solidity versions in the lockfile.
  - 'packages/interfold-contracts/.prettierrc.yml'
  - 'pnpm-lock.yaml'
  - '!**/*.md'
  - '!**/*.mdx'
