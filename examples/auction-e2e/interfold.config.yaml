  # Sepolia. Disabled by default: enable it only after the program is deployed (README, "Deploy to
  # Sepolia"). The interfold, ciphernode_registry, bonding_registry, slashing_manager and fee_token
  # entries are the official Interfold deployment (packages/interfold-contracts/deploy/protocol/
  # sepolia-protocol.deployment.json). For a deployment of your own protocol, replace them.
  # `pnpm deploy:sepolia` writes e3_program, and the keys that it finds in deployed_contracts.json.
  # Set rpc_url to a WebSocket endpoint of your provider.
  - name: 'sepolia'
    enabled: false
    rpc_url: 'wss://ethereum-sepolia-rpc.publicnode.com'
    chain_id: 11155111
    # Public RPC endpoints cap the block range of one log request. Lower this to match yours.
    rpc_log_range_blocks: 10000
    data_availability:
      mode: avail
      rpc_url: 'https://turing-rpc.avail.so/rpc'
    contracts:
      e3_program:
        address: "0x0000000000000000000000000000000000000000"
        deploy_block: 0
      interfold:
        address: "0xBD5B6D1aDA9e0eB248B678469C9Cd6a63507E42b"
        deploy_block: 11873232
      ciphernode_registry:
        address: "0xb1E8640CF8D0A927290E3d9E1b01c4899B5225Ef"
        deploy_block: 11873232
      bonding_registry:
        address: "0x8687bC7C8f055b41aD2C2447c04aCBD76C1075b2"
        deploy_block: 11873232
      slashing_manager:
        address: '0x5F9D21751aA24bc3D67C9B9D6ceEf2b62AAdac6d'
        deploy_block: 11873232
      fee_token:
        address: "0xE2e534F7Cb95777eD870CDCaCb80B1E9E2aD555B"
        deploy_block: 11856062
program:
  dev: false
  # Real proofs use program.openvm, with absolute paths local to the deployment:
  # openvm:
  #   prover_bin: /path/to/interfold-openvm-prover            # the CPU worker
  #   prover_bin_cuda: /path/to/interfold-openvm-prover-cuda  # optional; used when a GPU works
  #   backend: auto                                           # auto, cpu or cuda
  # `interfold program compile` builds ./guest against ./program, and `interfold program start`
  # serves real proofs. See the OpenVM worker README in the Interfold repository.
  # The scheduler defaults to 2 concurrent jobs and reserves 2 logical CPUs for Actix / libp2p.
  # It reduces concurrency when the host or cgroup memory limit is too small.
  # Example override on a dedicated 64 GB host:
  # node:
  #   multithread_reserve_threads: 2
  #   multithread_concurrent_jobs: 4
  #   # Test/CI only. Requires mock on-chain proof verifiers and an Interfold binary built with
  #   # the `test-only-skip-proof-aggregation` Cargo feature.
  #   skip_proof_aggregation: false
