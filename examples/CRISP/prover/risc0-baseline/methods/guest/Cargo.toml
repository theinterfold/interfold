[package]
name = "crisp-risc0-baseline-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "LGPL-3.0-only"

[workspace]
resolver = "3"

[dependencies]
e3-support-types = { path = "../../../../../../crates/support/types" }
e3-compute-provider = { git = "https://github.com/theinterfold/interfold", rev = "5668f4c9ee0992aeb05b320eaa3b998a6c32e525" }
fhe = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.2.2" }
fhe-traits = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.2.2" }
sha2 = "=0.10.9"
sha3 = "=0.10.8"
bincode = "=1.3.3"
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["std"] }
# Keep the ABI parser compatible with Interfold's Alloy 1.4.1 types.
alloy-sol-type-parser = "=1.4.1"

[profile.release]
lto = "thin"
