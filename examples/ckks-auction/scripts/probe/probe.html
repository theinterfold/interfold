<html><body><pre id="log"></pre><script type="module">
const log=(m)=>{document.getElementById('log').textContent+=m+'\n';console.log(m)}
const timings={};window.__t=timings
const timed=async(l,f)=>{const t0=performance.now();const r=await f();timings[l]=Math.round(performance.now()-t0);log(`${l}: ${timings[l]} ms`);return r}
try{
  const wasm=await timed('wasm load',()=>import('/pkg/main.js'))
  const pk=new Uint8Array(await (await fetch('/pkg/fixtures/pubkey_ps2.bin')).arrayBuffer())
  const bundle=await timed('encryptAndWitness ps2',()=>wasm.encryptAndWitness(2,pk,700,1,true,undefined))
  const {Noir}=await import('/vendor/noir_js');const {Barretenberg,UltraHonkBackend}=await import('/vendor/bb.js')
  const srs=Number(new URLSearchParams(location.search).get('srs')||'20')
  const api=await timed(`Barretenberg.new srs 2^${srs}`,()=>Barretenberg.new({srsSize:2**srs}))
  log(`crossOriginIsolated=${self.crossOriginIsolated} hw=${navigator.hardwareConcurrency} mem=${performance.memory?.jsHeapSizeLimit}`)
  for (const [name,inputs] of [['user_data_encryption_ckks_ct1_ps2',bundle.ct1_inputs],['user_data_encryption_ckks_ct0_ps2',bundle.ct0_inputs]]){
    const circuit=await timed(`fetch ${name}`,async()=>(await fetch(`/circuits/${name}.json`)).json())
    const noir=new Noir(circuit)
    const {witness}=await timed(`execute ${name}`,()=>noir.execute(inputs))
    const backend=new UltraHonkBackend(circuit.bytecode,api)
    const proof=await timed(`prove ${name}`,()=>backend.generateProof(witness,{verifierTarget:'evm'}))
    log(`proof ${proof.proof.length} bytes pub ${proof.publicInputs.length}`)
  }
  window.__done='ok'
}catch(e){window.__done='error: '+(e?.message??e);log(String(e?.stack??e))}
</script></body></html>
