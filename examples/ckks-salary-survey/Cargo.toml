[workspace]
members = ["server", "program"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"
description = "CKKS private salary survey — a full-stack Interfold E3 program"
repository = "https://github.com/theinterfold/interfold"

[workspace.dependencies]
ckks-salary-program = { path = "./program" }

# Interfold crates (path deps into the monorepo, like examples/CRISP).
e3-sdk = { path = "../../crates/sdk", default-features = false }
e3-fhe-params = { path = "../../crates/fhe-params" }
e3-trckks = { path = "../../crates/trckks" }
e3-utils = { path = "../../crates/utils" }

fhe = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.2.2" }
fhe-traits = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.2.2" }
fhe-math = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.2.2" }
fhe-util = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.2.2" }

actix-cors = "=0.7.1"
actix-web = "=4.11.0"
alloy = { version = "=1.0.41", features = ["full", "rpc-types-eth"] }
alloy-primitives = { version = "=1.4.1", default-features = false, features = ["rlp", "serde", "std"] }
alloy-sol-types = "=1.4.1"
anyhow = "=1.0.98"
async-trait = "=0.1.88"
chrono = "=0.4.41"
clap = { version = "=4.6.0", features = ["derive"] }
config = "=0.14.0"
dotenvy = "=0.15.7"
env_logger = "=0.11.8"
eyre = "=0.6.12"
hex = "=0.4.3"
log = "=0.4.27"
once_cell = "=1.21.3"
serde = { version = "=1.0.228", features = ["derive", "std"] }
serde_json = "=1.0.145"
sled = "=0.34.7"
thiserror = "=1.0.69"
tokio = { version = "=1.46.1", features = ["full"] }

# DEV ONLY (feat/ckks-user-data-encryption): the CKKS module lives on the
# local fhe.rs checkout until it is released as a tag. Must match the
# interfold root Cargo.toml patch or CkksParameters types diverge.
[patch."https://github.com/gnosisguild/fhe.rs"]
fhe = { path = "../../../fhe.rs/crates/fhe" }
fhe-traits = { path = "../../../fhe.rs/crates/fhe-traits" }
fhe-math = { path = "../../../fhe.rs/crates/fhe-math" }
fhe-util = { path = "../../../fhe.rs/crates/fhe-util" }

[profile.release]
opt-level = 3
