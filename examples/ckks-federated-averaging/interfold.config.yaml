# Ciphernode config for the CKKS federated-averaging dev stack. The scripts use tests/integration/interfold.config.yaml (synced by deploy.sh); this copy documents the 5-node shape.
chains:
  - name: 'localhost'
    rpc_url: 'ws://localhost:8545'
    contracts:
      e3_program:
        address: "0x09635F643e140090A9A8Dcd712eD6285858ceBef"
        deploy_block: 33
      interfold:
        address: "0x1fA02b2d6A771842690194Cf62D91bdd92BfE28d"
        deploy_block: 71
      ciphernode_registry:
        address: "0xa513E6E4b8f2a923D98304ec87F64353C4D5C853"
        deploy_block: 13
      bonding_registry:
        address: "0x9A676e781A523b5d0C0e43731313A708CB607508"
        deploy_block: 14
      slashing_manager:
        address: "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
        deploy_block: 11
      fee_token:
        address: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
        deploy_block: 8

program:
  dev: true
  # risc0:
  #   risc0_dev_mode: 0 # 0 = production (Boundless), 1 = dev mode (fake proofs)
  #   boundless:
  #     rpc_url: "https://sepolia.infura.io/v3/YOUR_KEY"
  #     private_key: "PRIVATE_KEY" # Use env vars for secrets
  #     pinata_jwt: "PINATA_JWT" # For uploading programs
  #     program_url: "https://gateway.pinata.cloud/ipfs/QmNMRAB7DW43JSmENfzGmD96G6sqaeBBNfTVrrq5WQae3D" # Pre-uploaded program
  #     onchain: true # true = onchain requests, false = offchain
  #     Optional — custom auction parameters (defaults shown):
  #     min_price_eth: 0.00005
  #     max_price_eth: 0.002
  #     timeout_secs: 600
  #     lock_timeout_secs: 300
  #     ramp_up_secs: 60
  #     lock_collateral_zkc: 2.0
  # Default profile: multithread uses (logical CPUs - 1) Rayon workers and the same concurrent job
  # limit. Reserve threads with `multithread_reserve_threads` (default 1 for Actix / libp2p).
  # Example override on a 16-core host:
  # node:
  #   multithread_reserve_threads: 1
  #   multithread_concurrent_jobs: 8
  #   # Test/CI only. Requires mock on-chain proof verifiers and an Interfold binary built with
  #   # the `test-only-skip-proof-aggregation` Cargo feature.
  #   skip_proof_aggregation: false

