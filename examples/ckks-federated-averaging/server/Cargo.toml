[package]
name = "ckks-fedavg"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "CKKS private federated-averaging coordination server (indexer + round registry + policy evaluation)"
rust-version = "1.91.1"

[[bin]]
name = "server"
path = "src/server/main.rs"

[[bin]]
name = "cli"
path = "src/cli/main.rs"

[dependencies]
actix-cors.workspace = true
actix-web.workspace = true
alloy.workspace = true
alloy-primitives.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
config.workspace = true
dotenvy.workspace = true
env_logger.workspace = true
eyre.workspace = true
hex.workspace = true
log.workspace = true
num-bigint.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
sled.workspace = true
thiserror.workspace = true
tokio.workspace = true

e3-sdk = { workspace = true, features = ["evm", "indexer"] }
e3-fhe-params.workspace = true
e3-zk-helpers.workspace = true
ckks-fedavg-program = { path = "../program" }
