[package]
name = "ckks-zk-inputs-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CKKS client-side encryption + Greco witness inputs (native core + WASM/JavaScript bindings)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
e3-zk-helpers = { workspace = true }
e3-fhe-params = { workspace = true }
e3-polynomial = { workspace = true }
fhe = { workspace = true }
fhe-traits = { workspace = true }
fhe-math = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
hex = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
# getrandom wasm backends (mirrors crates/wasm + CRISP zk-inputs-wasm):
# 0.3 via the `wasm_js` feature + `--cfg getrandom_backend="wasm_js"` in
# .cargo/config.toml; 0.2 (transitive, ark-std/rand_core 0.6) via `js`.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
# Native-only: the ParamSet-5 layout helpers the coefficient test checks
# against (trckks pulls tokio/actix-free crypto only, but keep it out of
# the wasm build).
e3-trckks = { workspace = true }

[[bin]]
name = "ckks_test_pubkey"
path = "src/bin/ckks_test_pubkey.rs"
required-features = []
